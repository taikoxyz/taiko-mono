name: CI
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "packages/ejector/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/ejector/**"
    branches-ignore:
      - release-please--branches--**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') && !startsWith(github.head_ref, 'dependabot') }}
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Toolchain + components (rustfmt, clippy)
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      # Cache target/ and cargo registry/git
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "ejector"
          # Only the Test job saves this shared key; lint just consumes it.
          save-if: "false"
          workspaces: |
            packages/ejector

      # If any crate still pulls OpenSSL at build-time, uncomment:
      # - name: Install native deps (for openssl-sys)
      #   run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: cargo fmt --check
        working-directory: packages/ejector
        run: cargo fmt --all -- --check

      - name: cargo clippy (workspace)
        working-directory: packages/ejector
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') }}
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "ejector"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            packages/ejector

      # Fast path: plain tests (works even without llvm-cov)
      - name: cargo test (workspace)
        working-directory: packages/ejector
        run: cargo test --workspace --all-features --all-targets

  coverage:
    # optional: keep if you use Codecov; otherwise delete this job
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') }}
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: "ejector"
          # Only the Test job saves this shared key; coverage just consumes it.
          save-if: "false"
          workspaces: |
            packages/ejector

      - name: Generate coverage (lcov)
        working-directory: packages/ejector
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lcov.info
          path: packages/ejector/lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: packages/ejector/lcov.info
          flags: ejector
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
