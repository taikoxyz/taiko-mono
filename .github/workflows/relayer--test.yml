name: "Relayer CI"

permissions:
  contents: read
  # actions: write is required by styfle/cancel-workflow-action below.
  actions: write

on:
  push:
    branches: [main]
    paths:
      - "packages/relayer/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/relayer/**"
      - "go.mod"
      - "go.sum"
      - "!**/*.md"
    branches-ignore:
      - release-please--branches--**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-relayer:
    name: lint-relayer
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false
          && !startsWith(github.head_ref, 'release-please')
          && !startsWith(github.head_ref, 'dependabot'))
    # GitHub-hosted: fresh VM per job, so fork PRs get real CI (with no secrets and a read-only token).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod download
        run: go mod download

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Optional: version of golangci-lint to use in form of v1.2 or v1.2.3 or `latest` to use the latest version
          version: latest

          # Optional: working directory, useful for monorepos
          working-directory: ./packages/relayer
          args: --config=.golangci.yml --timeout=4m

  test-relayer:
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false
          && !startsWith(github.head_ref, 'release-please')
          && !startsWith(github.head_ref, 'dependabot'))
    # GitHub-hosted: fresh VM per job, so fork PRs get real CI (with no secrets and a read-only token).
    runs-on: ubuntu-latest
    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: relayer - Unit Tests
        working-directory: ./packages/relayer
        run: go test `go list ./... | grep -v ./contracts | grep -v ./mock | grep -v ./cmd` -timeout=20m -coverprofile=coverage.txt -covermode=atomic

      - name: relayer - Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./packages/relayer/coverage.txt
          flags: relayer
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
