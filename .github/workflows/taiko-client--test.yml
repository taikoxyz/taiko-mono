name: "CI"

on:
  push:
    branches: [main]
    paths:
      - "packages/taiko-client/**"
      # `DeployProtocolOnL1`'s import closure reaches `contracts/`, `test/shared/` and the
      # inbox mocks under `test/`, so listing only the obvious directories goes stale the
      # moment someone adds an import — the same silent gap this workflow just fixed. These
      # are `protocol.yml`'s own paths instead: whatever can affect the protocol build can
      # affect the contracts these tests deploy. `deployments/` is excluded because
      # `deploy_l1.json` is generated by the run, not read into it.
      - "packages/protocol/**"
      - "!packages/protocol/contract_layout_*"
      - "!packages/protocol/audit/**"
      - "!packages/protocol/docs/**"
      - "!packages/protocol/simulation/**"
      - "!packages/protocol/deployments/**"
      - "!packages/protocol/script/layer2/hekla/**"
      - "!packages/protocol/script/layer2/mainnet/**"
      - "!packages/protocol/script/layer1/hekla/**"
      - "!packages/protocol/script/layer1/mainnet/**"
      - "!packages/protocol/script/layer1/preconf/**"
      - "!packages/protocol/script/layer1/provers/**"
      - "!packages/protocol/script/layer1/team/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/taiko-client/**"
      # `DeployProtocolOnL1`'s import closure reaches `contracts/`, `test/shared/` and the
      # inbox mocks under `test/`, so listing only the obvious directories goes stale the
      # moment someone adds an import — the same silent gap this workflow just fixed. These
      # are `protocol.yml`'s own paths instead: whatever can affect the protocol build can
      # affect the contracts these tests deploy. `deployments/` is excluded because
      # `deploy_l1.json` is generated by the run, not read into it.
      - "packages/protocol/**"
      - "!packages/protocol/contract_layout_*"
      - "!packages/protocol/audit/**"
      - "!packages/protocol/docs/**"
      - "!packages/protocol/simulation/**"
      - "!packages/protocol/deployments/**"
      - "!packages/protocol/script/layer2/hekla/**"
      - "!packages/protocol/script/layer2/mainnet/**"
      - "!packages/protocol/script/layer1/hekla/**"
      - "!packages/protocol/script/layer1/mainnet/**"
      - "!packages/protocol/script/layer1/preconf/**"
      - "!packages/protocol/script/layer1/provers/**"
      - "!packages/protocol/script/layer1/team/**"
      - "go.mod"
      - "go.sum"
      - "!**/*.md"
    branches-ignore:
      - release-please--branches--**

concurrency:
  group: taiko-client-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: ${{ github.event.pull_request.draft == false  && !startsWith(github.head_ref, 'release-please') && !startsWith(github.head_ref, 'dependabot') }}
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Go mod download
        run: go mod download

      - name: Ensure build-essential is installed
        run: |
          set -euo pipefail
          if [ "${RUNNER_DEBUG:-}" = "1" ]; then set -x; fi

          if command -v gcc >/dev/null 2>&1 && \
             command -v g++ >/dev/null 2>&1 && \
             command -v make >/dev/null 2>&1; then
            echo "Required build tools are already available."
            exit 0
          fi

          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::gcc/g++/make are missing and apt-get is unavailable, cannot install automatically."
            exit 1
          fi

          export DEBIAN_FRONTEND=noninteractive

          retry=0
          until sudo apt-get update; do
            retry=$((retry + 1))
            if [ "${retry}" -ge 4 ]; then
              echo "::error::apt-get update failed after ${retry} attempts."
              exit 1
            fi
            echo "::warning::apt-get update failed, retrying (${retry}/3)"
            sleep 5
          done

          sudo apt-get install -y --no-install-recommends build-essential

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ./packages/taiko-client
          args: --timeout=10m --config=.golangci.yml ./...

  integration_tests:
    if: ${{ github.event.pull_request.draft == false  && !startsWith(github.head_ref, 'release-please') }}
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: 1

    strategy:
      fail-fast: false
      matrix:
        execution_node: [l2_geth, l2_reth]

    steps:
      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Ensure make is available
        uses: ./.github/actions/ensure-make

      - name: Ensure build-essential is installed
        run: |
          set -euo pipefail
          if [ "${RUNNER_DEBUG:-}" = "1" ]; then set -x; fi

          if command -v gcc >/dev/null 2>&1 && \
             command -v g++ >/dev/null 2>&1 && \
             command -v make >/dev/null 2>&1; then
            echo "Required build tools are already available."
            exit 0
          fi

          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::gcc/g++/make are missing and apt-get is unavailable, cannot install automatically."
            exit 1
          fi

          export DEBIAN_FRONTEND=noninteractive

          retry=0
          until sudo apt-get update; do
            retry=$((retry + 1))
            if [ "${retry}" -ge 4 ]; then
              echo "::error::apt-get update failed after ${retry} attempts."
              exit 1
            fi
            echo "::warning::apt-get update failed, retrying (${retry}/3)"
            sleep 5
          done

          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install pnpm dependencies
        uses: ./.github/actions/install-pnpm-dependencies
        with:
          cache-dependency-path: pnpm-lock.yaml

      # Deploy the PR's own protocol contracts: a second checkout pinned to `main`
      # would test different contracts on every re-run and never exercise a PR
      # that changes protocol and client together.
      - name: Install pnpm dependencies for protocol
        working-directory: packages/protocol
        run: pnpm install

      - name: Run Tests on ${{ matrix.execution_node }} execution engine
        working-directory: packages/taiko-client
        env:
          L2_NODE: ${{ matrix.execution_node }}
          PROTOCOL_DIR: ${{ github.workspace }}/packages/protocol
        run: make test

      - name: Codecov.io
        uses: codecov/codecov-action@v7
        with:
          files: packages/taiko-client/coverage.out
          flags: taiko-client
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
