name: Vercel Build and Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      flags:
        type: string
        required: true
    secrets:
      vercel_project_id:
        description: "Vercel Project ID"
        required: true
      vercel_org_id:
        description: "Vercel ORG ID"
        required: true
      vercel_token:
        description: "Vercel TOKEN"
        required: true

env:
  VERCEL_ORG_ID: ${{ secrets.vercel_org_id }}
  VERCEL_PROJECT_ID: ${{ secrets.vercel_project_id }}

permissions:
  contents: read

jobs:
  build-deploy:
    if: ${{ github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'dependabot') && github.event.pull_request.head.repo.fork == false) }}
    runs-on: ubuntu-latest
    steps:
      - name: Print Vercel Project ID
        run: |
          echo "Vercel Project ID: ${{ env.VERCEL_PROJECT_ID }}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm dependencies
        uses: ./.github/actions/install-pnpm-dependencies

      - name: Install Vercel CLI
        run: pnpm add --global vercel@53.3.2

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ inputs.environment }} --token=${{ secrets.vercel_token }}

      - name: Build Project Artifacts
        run: vercel build ${{ inputs.flags }} --token=${{ secrets.vercel_token }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt ${{ inputs.flags }} --force --token=${{ secrets.vercel_token }}
