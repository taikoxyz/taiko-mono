name: Bridge UI CI/CD

on:
  push:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/actions/install-pnpm-dependencies/**"
      - "packages/bridge-ui/**"
    branches-ignore:
      - dependabot/**
      - release-please--branches--**

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".nvmrc"
      - ".github/actions/install-pnpm-dependencies/**"
      - "packages/bridge-ui/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    if: >-
      ${{ github.event.pull_request.draft == false
      && !startsWith(github.head_ref, 'release-please')
      && (github.event.action != 'labeled' || github.event.label.name == 'option.workflow_on')
      && (!startsWith(github.head_ref, 'dependabot/') || contains(github.event.pull_request.labels.*.name, 'option.workflow_on')) }}
    uses: ./.github/workflows/bridge-ui--ci.yml
