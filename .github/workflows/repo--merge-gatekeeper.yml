name: Merge Gatekeeper

on:
  pull_request:
    types: [synchronize, opened, reopened, edited, ready_for_review]
  merge_group: # Trigger in merge queue to pass the required status check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  merge-gatekeeper:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    permissions:
      checks: read
      statuses: read
    steps:
      - name: Run Merge Gatekeeper
        uses: upsidr/merge-gatekeeper@09af7a82c1666d0e64d2bd8c01797a0bcfd3bb5d # v1.2.1
        with:
          timeout: 1800
          interval: 60
          token: ${{ secrets.GITHUB_TOKEN }}
          ignored: "deepseek-review"
