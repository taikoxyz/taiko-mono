name: "CI"
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "testdata/derivation_vectors/**"
      - "packages/taiko-client-rs/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "testdata/derivation_vectors/**"
      - "packages/taiko-client-rs/**"
      - "!**/*.md"

concurrency:
  group: taiko-client-rs-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lockfile:
    if: ${{ github.event.pull_request.draft == false }}
    name: Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Check Cargo.lock
        working-directory: packages/taiko-client-rs
        run: cargo fetch --locked

  lint:
    if: ${{ github.event.pull_request.draft == false  && !startsWith(github.head_ref, 'release-please') && !startsWith(github.head_ref, 'dependabot') }}
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Ensure native build tools
        shell: bash
        run: |
          set -euxo pipefail

          if command -v cc > /dev/null 2>&1 && command -v llvm-config > /dev/null 2>&1; then
            cc --version
            echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$(whoami)" = root ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          if command -v apt-get > /dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y build-essential pkg-config clang libclang-dev llvm-dev
          else
            echo "ERROR: apt-get is required to install build tools on this runner"
            exit 1
          fi

          cc --version
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Lint keeps its own key instead of consuming the Tests one: clippy's
          # --all-features check units fingerprint differently from the nextest
          # build, so the shared cache still recompiled the heavy reth-db/libmdbx
          # tail (mdbx C build script included) on every run. Saved by lint itself
          # on main pushes, restored by PR lint runs.
          shared-key: "taiko-client-rs-lint"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            packages/taiko-client-rs -> target

      # Deliberately after rust-cache: keeping the pinned nightly out of the
      # cache key means bumping it doesn't invalidate the lint cache.
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-09-27
          components: rustfmt

      - name: Setup just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.5.0

      - name: Install cargo-sort
        uses: taiki-e/install-action@v2.87.21
        with:
          tool: cargo-sort

      - name: Check formatting
        working-directory: packages/taiko-client-rs
        run: just fmt-check

      - name: Check clippy
        working-directory: packages/taiko-client-rs
        run: just clippy

  # Unit tests need no docker — fast fail-first signal while the Tests job below
  # runs the docker scenarios.
  unit:
    if: ${{ github.event.pull_request.draft == false  && !startsWith(github.head_ref, 'release-please') }}
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Ensure native build tools
        shell: bash
        run: |
          set -euxo pipefail

          if command -v cc > /dev/null 2>&1 && command -v llvm-config > /dev/null 2>&1; then
            cc --version
            echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$(whoami)" = root ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          if command -v apt-get > /dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y build-essential pkg-config clang libclang-dev llvm-dev
          else
            echo "ERROR: apt-get is required to install build tools on this runner"
            exit 1
          fi

          cc --version
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Install mold
        shell: bash
        run: |
          set -euxo pipefail
          MOLD_VERSION=2.40.4
          ARCH="$(uname -m)"

          if [ "$(whoami)" = root ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          curl -fsSL "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-${ARCH}-linux.tar.gz" \
            | $SUDO tar -C /usr/local --strip-components=1 --no-overwrite-dir -xzf -

          if [ "$(readlink -f /usr/bin/ld)" != /usr/local/bin/mold ]; then
            $SUDO ln -sf /usr/local/bin/mold /usr/bin/ld
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "taiko-client-rs"
          # The Tests job is the sole saver of this shared key.
          save-if: "false"
          workspaces: |
            packages/taiko-client-rs -> target

      - name: Setup just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.5.0

      - uses: taiki-e/install-action@nextest

      - name: Run unit tests
        working-directory: packages/taiko-client-rs
        run: just unit

  test:
    if: ${{ github.event.pull_request.draft == false  && !startsWith(github.head_ref, 'release-please') }}
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v7

      - name: Ensure native build tools
        shell: bash
        run: |
          set -euxo pipefail

          if command -v cc > /dev/null 2>&1 && command -v llvm-config > /dev/null 2>&1; then
            cc --version
            echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$(whoami)" = root ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          if command -v apt-get > /dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y build-essential pkg-config clang libclang-dev llvm-dev
          else
            echo "ERROR: apt-get is required to install build tools on this runner"
            exit 1
          fi

          cc --version
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Install mold
        shell: bash
        run: |
          set -euxo pipefail
          MOLD_VERSION=2.40.4
          ARCH="$(uname -m)"

          if [ "$(whoami)" = root ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          curl -fsSL "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-${ARCH}-linux.tar.gz" \
            | $SUDO tar -C /usr/local --strip-components=1 --no-overwrite-dir -xzf -

          if [ "$(readlink -f /usr/bin/ld)" != /usr/local/bin/mold ]; then
            $SUDO ln -sf /usr/local/bin/mold /usr/bin/ld
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: "taiko-client-rs"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            packages/taiko-client-rs -> target

      - name: Setup just
        uses: extractions/setup-just@v4
        with:
          just-version: 1.5.0

      - name: Check protocol feature isolation
        working-directory: packages/taiko-client-rs
        run: just check-features

      - uses: taiki-e/install-action@nextest

      # The abci docker scenarios: each boots its own anvil + alethia-reth + CometBFT
      # devnet through the docker CLI, one scenario at a time.
      - name: Run docker scenarios
        working-directory: packages/taiko-client-rs
        env:
          # The alethia-reth image built from taikoxyz/alethia-reth#248, until that PR merges.
          # tests/entrypoint.sh and crates/test-harness/src/boot.rs default to the same tag, so
          # when it merges move all three to alethia-reth:main (dropping only this variable
          # keeps the sha-1e25b48 default).
          ALETHIA_RETH_IMAGE: us-docker.pkg.dev/evmchain/images/alethia-reth:sha-1e25b48
        run: just test

      # Each scenario removes its devnet when it ends, but a job cancellation or
      # timeout can skip that; remove leftover `abci-*` containers and networks so
      # they can't poison the next run on this runner. A real removal failure must
      # fail the job loudly instead of leaving that poison behind.
      - name: Remove leftover devnet containers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker ps -aq --filter name=^abci- | xargs -r docker rm -f -v
          docker network ls -q --filter name=^abci- | xargs -r docker network rm
