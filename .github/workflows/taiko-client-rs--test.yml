name: "CI"
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "testdata/derivation_vectors/**"
      - "testdata/etna_vectors/**"
      - "packages/taiko-client-rs/**"
      - ".github/workflows/taiko-client-rs--test.yml"
      - ".github/actions/setup-taiko-client-rs/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "testdata/derivation_vectors/**"
      - "testdata/etna_vectors/**"
      - "packages/taiko-client-rs/**"
      - ".github/workflows/taiko-client-rs--test.yml"
      - ".github/actions/setup-taiko-client-rs/**"
      - "!**/*.md"
  # The full docker suite, including the slow scenarios pull requests skip.
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

concurrency:
  group: taiko-client-rs-test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lockfile:
    if: ${{ github.event.pull_request.draft == false }}
    name: Lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0

      - name: Check Cargo.lock
        working-directory: packages/taiko-client-rs
        run: cargo fetch --locked

  lint:
    if: ${{ github.event.pull_request.draft == false  && !startsWith(github.head_ref, 'release-please') && !startsWith(github.head_ref, 'dependabot') }}
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure native build tools
        shell: bash
        run: |
          set -euxo pipefail

          if command -v cc > /dev/null 2>&1 && command -v llvm-config > /dev/null 2>&1; then
            cc --version
            echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ "$(whoami)" = root ]; then
            SUDO=""
          else
            SUDO="sudo"
          fi

          if command -v apt-get > /dev/null 2>&1; then
            $SUDO apt-get update
            $SUDO apt-get install -y build-essential pkg-config clang libclang-dev llvm-dev
          else
            echo "ERROR: apt-get is required to install build tools on this runner"
            exit 1
          fi

          cc --version
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          components: clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          # Lint keeps its own key instead of consuming the Tests one: clippy's
          # --all-features check units fingerprint differently from the nextest
          # build, so the shared cache still recompiled the heavy reth-db/libmdbx
          # tail (mdbx C build script included) on every run. Saved by lint itself
          # on main pushes, restored by PR lint runs.
          shared-key: "taiko-client-rs-lint"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            packages/taiko-client-rs -> target

      # Deliberately after rust-cache: keeping the pinned nightly out of the
      # cache key means bumping it doesn't invalidate the lint cache.
      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2025-09-27
          components: rustfmt

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.5.0

      - name: Check formatting
        working-directory: packages/taiko-client-rs
        run: just fmt-check

      - name: Check clippy
        working-directory: packages/taiko-client-rs
        run: just clippy

  # The lander contract fixtures, the IEtnaInbox copy and the shared Etna vectors must be what
  # script/gen_lander_artifacts.sh produces from the pinned protocol revision.
  lander-artifacts:
    if: ${{ github.event.pull_request.draft == false  && !startsWith(github.head_ref, 'release-please') && !startsWith(github.head_ref, 'dependabot') }}
    name: Lander artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # As .github/actions/install-pnpm-dependencies: git-hosted pnpm dependencies over HTTPS.
      - name: Set up Git to use HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          # A release built from the commit recorded in
          # crates/lander/tests/fixtures/contracts/manifest.json (`foundryVersion`).
          version: v1.7.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"

      - name: Setup just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.5.0

      - name: Regenerate and compare
        working-directory: packages/taiko-client-rs
        run: just check-lander-artifacts

  signer:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') }}
    name: Signer Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache-dependency-path: packages/taiko-client-rs/tools/etna-signer/go.sum
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.5.0
      - name: Run guarded signer race tests
        working-directory: packages/taiko-client-rs
        run: just signer-test

  supervisor:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') }}
    name: Supervisor Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: 1.5.0
      - name: Run Python process regressions
        working-directory: packages/taiko-client-rs
        run: just supervisor-test

  rust-unit:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') }}
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-taiko-client-rs
        with:
          cache-key: taiko-client-rs-unit
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          nextest: "true"
      - name: Check protocol feature isolation
        working-directory: packages/taiko-client-rs
        run: just check-features
      - name: Run unit tests
        working-directory: packages/taiko-client-rs
        run: just unit

  el-import:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') }}
    name: EL Import Checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-taiko-client-rs
        with:
          cache-key: taiko-client-rs-el-import
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          nightly: "true"
      - name: Verify local EL import helper
        working-directory: packages/taiko-client-rs
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/taiko-client-rs/target
        run: just el-import-verify

  docker:
    if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') }}
    name: Docker Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TAIKO_CLIENT_RS_TEST_RUN: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free space for native and Docker builds
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: ./.github/actions/setup-taiko-client-rs
        with:
          cache-key: taiko-client-rs-docker
          save-cache: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
          nextest: "true"
          go: "true"
      - name: Run serial Docker partition
        working-directory: packages/taiko-client-rs
        run: just ${{ github.event_name == 'pull_request' && 'test' || 'test-full' }} --partition hash:${{ matrix.shard }}/2
      - name: Remove leftover devnet containers
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker ps -aq --filter "label=taiko-client-rs.test-run=$TAIKO_CLIENT_RS_TEST_RUN" | xargs -r docker rm -f -v
          docker network ls -q --filter "label=taiko-client-rs.test-run=$TAIKO_CLIENT_RS_TEST_RUN" | xargs -r docker network rm

  resources:
    if: ${{ github.event_name != 'pull_request' && github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') }}
    name: Checkpoint Resources
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free space for native resource builds
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: ./.github/actions/setup-taiko-client-rs
        with:
          cache-key: taiko-client-rs-resources
          save-cache: ${{ github.ref == 'refs/heads/main' }}
          go: "true"
      - name: Verify complete checkpoint windows and resource limits
        working-directory: packages/taiko-client-rs
        run: just checkpoint-import-resources

  unit:
    if: ${{ always() && github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') }}
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [signer, supervisor, rust-unit]
    steps:
      - name: Require language checks
        env:
          SIGNER_RESULT: ${{ needs.signer.result }}
          SUPERVISOR_RESULT: ${{ needs.supervisor.result }}
          RUST_RESULT: ${{ needs.rust-unit.result }}
        run: test "$SIGNER_RESULT" = success && test "$SUPERVISOR_RESULT" = success && test "$RUST_RESULT" = success

  test:
    if: ${{ always() && github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') }}
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [docker, el-import, resources]
    steps:
      - name: Require integration and helper checks
        env:
          DOCKER_RESULT: ${{ needs.docker.result }}
          HELPER_RESULT: ${{ needs.el-import.result }}
          RESOURCE_RESULT: ${{ needs.resources.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$DOCKER_RESULT" = success
          test "$HELPER_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$RESOURCE_RESULT" = skipped
          else
            test "$RESOURCE_RESULT" = success
          fi
