name: Claude Code
# https://docs.anthropic.com/en/docs/claude-code/github-actions

on:
  issue_comment:
    types: [created]

jobs:
  gate:
    # SECURITY: only owners/members/collaborators can trigger this: issue_comment runs with repo
    # secrets and bypasses the fork-PR approval gate. The PR is resolved and forks are refused in
    # this job, which has no secrets and read-only access, so nothing runs next to the write token
    # or ANTHROPIC_API_KEY before the check passes.
    if: >-
      github.event_name == 'issue_comment'
      && contains(github.event.comment.body, '@claude')
      && github.event.issue.pull_request != null
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve PR head and refuse forks
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          BASE_REPO: ${{ github.repository }}
        run: |
          pr=$(gh api "$PR_URL")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
          head_sha=$(jq -r '.head.sha' <<<"$pr")
          # Owner/repo names are case-insensitive; a deleted head repo (null) is refused too.
          if [ "${head_repo,,}" != "${BASE_REPO,,}" ]; then
            echo "Refusing to run: PR head is '${head_repo}', not ${BASE_REPO} (fork PRs are not supported)." >&2
            exit 1
          fi
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

  claude:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SECURITY: Pin to exact commit at comment time to prevent TOCTOU attacks
          ref: ${{ needs.gate.outputs.head_sha }}
          # Fetch more history for better git operations
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "20"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            Perform a comprehensive code review of the changes in this pull request.

            For protocol(smart contract) changes always start in the `packages/protocol` directory.
            You MUST run `pnpm install --ignore-scripts` first for security (prevents malicious lifecycle scripts).
            You MUST follow the development workflow described in CLAUDE.md.
            You MUST make sure the tests are passing before creating a pull request.
            You MUST open a draft pull request after creating a branch.
            You MUST create a pull request after completing your task.
            You can create pull requests using the `mcp__github__create_pull_request` tool.

            Use top-level comments for the review. Leave out sections that have no relevance, for example if it is a documentation change testing may be irrelevant.
            Be constructive and helpful in your feedback. Don't be overly polite or verbose, be direct.
          # Tools for comprehensive PR review
          claude_args: |
            --allowedTools "
              mcp__github_inline_comment__create_inline_comment,
              Bash(gh pr comment:*),
              Bash(gh pr diff:*),
              Bash(gh pr view:*),
              Bash(pnpm install --ignore-scripts),
              Bash(pnpm test:*),
              Bash(pnpm fmt:sol),
              Bash(pnpm snapshot:*),
              Bash(pnpm compile:*),
              Bash(pnpm layout:*),
              Bash(cat *),
              Bash(find *),
              Bash(grep *),
              Bash(ls *),
              WebFetch(domain:docs.anthropic.com)
            "
          use_sticky_comment: true
