name: Claude Code
# https://docs.anthropic.com/en/docs/claude-code/github-actions

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    # SECURITY: only owners/members/collaborators can trigger this: issue_comment runs with repo
    # secrets and bypasses the fork-PR approval gate. The PR is resolved and forks are refused in
    # this job, which has no secrets and read-only access, so nothing runs next to the write token
    # or ANTHROPIC_API_KEY before the check passes.
    if: >-
      github.event_name == 'issue_comment'
      && contains(github.event.comment.body, '@claude')
      && github.event.issue.pull_request != null
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      head_sha: ${{ steps.pr.outputs.head_sha }}
    steps:
      - name: Resolve PR head and refuse forks
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh api "$PR_URL")
          head_repo=$(jq -r '.head.repo.full_name // ""' <<<"$pr")
          head_sha=$(jq -r '.head.sha // ""' <<<"$pr")
          # Owner/repo names are case-insensitive; a deleted head repo (null) is refused too.
          if [ "${head_repo,,}" != "${BASE_REPO,,}" ]; then
            echo "Refusing to run: PR head is '${head_repo}', not ${BASE_REPO} (fork PRs are not supported)." >&2
            exit 1
          fi
          # Fail closed: an empty SHA would make checkout fall back to the default branch.
          if [[ ! "$head_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Refusing to run: unexpected PR head SHA '${head_sha}'." >&2
            exit 1
          fi
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

  claude:
    needs: gate
    # Explicit, so a future change to the gate (e.g. continue-on-error) can never let this job run unchecked.
    if: needs.gate.result == 'success'
    runs-on: ubuntu-latest
    # Review-only: read the checkout, comment on the PR. No contents: write and no id-token: write,
    # because the action is given this job's token below instead of minting a Claude App token
    # (which always carries contents: write).
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SECURITY: Pin to exact commit at comment time to prevent TOCTOU attacks
          ref: ${{ needs.gate.outputs.head_sha }}
          # Fetch more history for better git operations
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # SECURITY: use the job's least-privilege token rather than the Claude App token.
          github_token: ${{ github.token }}
          track_progress: true
          prompt: |
            Perform a code review of the changes in this pull request. This is a review only:
            do not modify files, run builds or tests, commit, push, or open pull requests.

            Use `gh pr diff` and `gh pr view` to see the changes, and the Read, Grep and Glob tools to
            inspect the surrounding code. For protocol (smart contract) changes, start in the
            `packages/protocol` directory and follow the conventions in its CLAUDE.md.

            Use top-level comments for the review and inline comments for specific lines. Leave out
            sections that have no relevance, for example testing for a documentation-only change.
            Be constructive and direct; don't be overly polite or verbose.
          # Read-only review tools. No shell beyond the gh PR commands: anything that runs code from
          # the PR (pnpm scripts, find -exec, ...) would run next to ANTHROPIC_API_KEY.
          # Tag mode (track_progress) also grants edit and git commit/push tools; they are denied here,
          # and any push left (the action's git-push wrapper) fails on the contents: read token.
          claude_args: |
            --allowedTools "
              Read,
              Grep,
              Glob,
              mcp__github_inline_comment__create_inline_comment,
              Bash(gh pr comment:*),
              Bash(gh pr diff:*),
              Bash(gh pr view:*),
              WebFetch(domain:docs.anthropic.com)
            "
            --disallowedTools "
              Edit,
              MultiEdit,
              Write,
              NotebookEdit,
              Bash(git add:*),
              Bash(git commit:*),
              Bash(git push:*),
              Bash(git rm:*),
              mcp__github_file_ops__commit_files,
              mcp__github_file_ops__delete_files
            "
          use_sticky_comment: true
