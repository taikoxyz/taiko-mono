name: Etna rule references

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packages/protocol/docs/etna/**"
      - ".github/workflows/protocol--etna-rules.yml"
  push:
    branches: [main]
    paths:
      - "packages/protocol/docs/etna/**"
      - ".github/workflows/protocol--etna-rules.yml"

permissions:
  contents: read

concurrency:
  # PRs compare with their merged base; main pushes compare with the previous main state.
  group: etna-rules-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install checker dependencies
        run: python3 -m pip install -r packages/protocol/docs/etna/rules/tools/requirements.txt

      - name: Ensure comparison base is available
        env:
          ETNA_RULES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$ETNA_RULES_BASE^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --depth=1 origin "$ETNA_RULES_BASE"; then
              echo "::error::Cannot retrieve the comparison base; a complete amendment delta cannot be checked."
              exit 1
            fi
          fi

      - name: Check rule references
        env:
          ETNA_RULES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 packages/protocol/docs/etna/rules/tools/check.py --amendments-base "$ETNA_RULES_BASE"

      - name: Test rule checker
        run: python3 -m unittest discover -s packages/protocol/docs/etna/rules/tools
