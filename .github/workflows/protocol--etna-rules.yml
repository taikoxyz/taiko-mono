name: Etna rule references

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "packages/protocol/docs/etna/**"
      - ".github/workflows/protocol--etna-rules.yml"
  push:
    branches: [main]
    paths:
      - "packages/protocol/docs/etna/**"

permissions:
  contents: read

concurrency:
  group: etna-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check rule references
        env:
          ETNA_RULES_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 packages/protocol/docs/etna/rules/tools/check.py --amendments-base "$ETNA_RULES_BASE"

      - name: Test rule checker
        run: python3 -m unittest discover -s packages/protocol/docs/etna/rules/tools
