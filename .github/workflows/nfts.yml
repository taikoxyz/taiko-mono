name: NFTs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/nfts/**"
      - "!packages/nfts/contract_layout_*"
    branches-ignore:
      - release-please--branches--**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # actions: write is required by styfle/cancel-workflow-action below.
  actions: write

jobs:
  build-nfts-contracts:
    if: >-
      github.event.pull_request.draft == false
      && !startsWith(github.head_ref, 'release-please')
    # GitHub-hosted: fresh VM per job, so fork PRs get real CI (with no secrets and a read-only token).
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install pnpm dependencies
        uses: ./.github/actions/install-pnpm-dependencies

      - name: Format solidity && update contract layout table
        working-directory: ./packages/nfts
        run: pnpm layout && forge fmt

      - name: Solidity compilation
        working-directory: ./packages/nfts
        run: pnpm compile

      - name: Unit Tests
        working-directory: ./packages/nfts
        run: pnpm test
