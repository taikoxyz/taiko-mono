name: NFTs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/nfts/**"
      - ".github/workflows/nfts.yml"
      - "!packages/nfts/contract_layout_*"
    branches-ignore:
      - release-please--branches--**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # actions: write is required by styfle/cancel-workflow-action below.
  actions: write

jobs:
  build-nfts-contracts:
    if: >-
      github.event.pull_request.draft == false
      && !startsWith(github.head_ref, 'release-please')
    # GitHub-hosted: fresh VM per job, so fork PRs get real CI (with no secrets and a read-only token).
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs
        # Fork PRs get a read-only token, so cancelling needs actions: write they do not have.
        if: github.event.pull_request.head.repo.fork != true
        uses: styfle/cancel-workflow-action@d07a454dad7609a92316b57b23c9ccfd4f59af66 # 0.13.1
        with:
          access_token: ${{ github.token }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2

      - name: Install pnpm dependencies
        uses: ./.github/actions/install-pnpm-dependencies

      - name: Format solidity && update contract layout table
        working-directory: ./packages/nfts
        run: pnpm layout && forge fmt

      - name: Solidity compilation
        working-directory: ./packages/nfts
        run: pnpm compile

      - name: Unit Tests
        working-directory: ./packages/nfts
        run: pnpm test
