name: Typo Check

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-for-typos:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'option.workflow_on')
      || (github.event.pull_request.draft == false
          && github.head_ref != 'release-please-*'
          && !startsWith(github.head_ref, 'dependabot'))
    # The typo check (crate-ci/typos, pinned) is safe to run against fork contents.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install wget
        run: sudo apt-get update && sudo apt-get install -y wget

      - name: Check for typos
        # SECURITY: pinned to a full commit SHA; Dependabot keeps it current.
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b # v1.51.1
        with:
          config: ${{github.workspace}}/_typos.toml
