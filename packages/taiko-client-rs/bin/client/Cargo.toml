[package]
name = "taiko-client"
version.workspace = true
description = "Rust client implementation for Taiko protocol"

edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# async
tokio = { workspace = true }

# ethereum
alloy-primitives = { workspace = true }
alloy-provider = { workspace = true }

# cli
clap = { workspace = true }

# observability
async-trait = { workspace = true }
axum = { workspace = true }
once_cell = { workspace = true }
prometheus = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# taiko
abci = { path = "../../crates/abci" }
lander = { path = "../../crates/lander" }
rpc = { path = "../../crates/rpc" }

# types
thiserror = { workspace = true }
toml = { workspace = true }
url = { workspace = true }

[dev-dependencies]
alloy = { workspace = true, features = ["std", "sol-types", "contract", "providers", "rpc-types", "json-abi"] }
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-rlp = { workspace = true }
alloy-trie = { workspace = true, features = ["std", "ethereum"] }
anyhow = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
http-body-util = { workspace = true }
libc = "0.2"
prost = { workspace = true }
protocol = { path = "../../crates/protocol", default-features = false }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tendermint = { workspace = true }
tendermint-proto = { workspace = true }
test-harness = { path = "../../crates/test-harness" }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
