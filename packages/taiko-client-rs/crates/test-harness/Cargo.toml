[package]
name = "test-harness"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
# async
async-trait = { workspace = true }
tokio = { workspace = true }

# ethereum
alloy = { workspace = true, features = ["consensus", "signer-local", "std", "json", "rpc-types"] }
alloy-eips = { workspace = true }
alloy-genesis = "2.4.2"
alloy-primitives = { workspace = true, features = ["std", "serde"] }
alloy-provider = { workspace = true }
alloy-trie = { workspace = true, features = ["ethereum"] }

# taiko
abci = { path = "../abci" }
alethia-reth-primitives = { workspace = true }
protocol = { path = "../protocol", default-features = false }
rpc = { path = "../rpc" }

# observability
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# web
reqwest = { workspace = true }

# types
anyhow = { workspace = true }
url = { workspace = true }

# serialization
serde = { workspace = true }
serde_json = { workspace = true }

# testing
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
k256 = { workspace = true, features = ["ecdsa"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
