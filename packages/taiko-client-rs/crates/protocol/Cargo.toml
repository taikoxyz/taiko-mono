[package]
name = "protocol"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true

[features]
default = ["net"]
net = ["alloy/default", "alloy-consensus/k256", "bindings", "alloy-provider"]

[dependencies]
# observability
tracing = { workspace = true }

# ethereum
alloy = { workspace = true, default-features = false, features = ["std", "sol-types"] }
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-hardforks = { workspace = true }
alloy-primitives = { workspace = true, default-features = false }
alloy-provider = { workspace = true, optional = true }
alloy-rlp = { workspace = true }
alloy-rpc-types-engine-2 = { workspace = true }

# crypto
k256 = { workspace = true }

# taiko
alethia-reth-chainspec = { workspace = true }
alethia-reth-consensus = { workspace = true }
alethia-reth-primitives = { workspace = true }
bindings = { path = "../bindings", optional = true }

# types
flate2 = { workspace = true }
thiserror = { workspace = true }

# serialization
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
