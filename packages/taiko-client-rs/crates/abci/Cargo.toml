[package]
name = "abci"
version.workspace = true
description = "ABCI++ application for the Etna PoS chain (CometBFT + alethia-reth)"
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

[dependencies]
# ethereum
alloy-consensus = { workspace = true }
alloy-eips = { workspace = true }
alloy-primitives = { workspace = true, features = ["std", "serde", "rlp"] }
alloy-rlp = { workspace = true, features = ["std", "derive"] }
alloy-trie = { workspace = true, features = ["std", "ethereum"] }

# taiko
alethia-reth-primitives = { workspace = true }
protocol = { path = "../protocol", default-features = false }

# types
thiserror = { workspace = true }

# serialization
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
