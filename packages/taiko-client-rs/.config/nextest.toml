nextest-version = "0.9.104"

[profile.default]

[[profile.default.overrides]]
# Integration test binaries (targets from any `tests/` dir) include the abci docker
# scenarios, each of which boots its own devnet (anvil, alethia-reth, CometBFT).
# Never run two of them at once, even outside `just test`, so they stay within the
# docker daemon's memory.
filter = 'kind(test)'
test-group = "docker"

[test-groups.docker]
max-threads = 1

# `just test` (tests/entrypoint.sh): the docker scenarios, one at a time. Booting a
# devnet and walking it through an epoch switch takes minutes, so a scenario is only
# flagged after 2 minutes and terminated after 10, which is above the harness's own
# readiness and progress deadlines; a scenario that wedges past them would otherwise
# stall the serial lane until the CI job timeout. Every scenario runs even after one
# fails, so a CI run reports all failures at once.
[profile.integration]
test-threads = 1
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 5 }
