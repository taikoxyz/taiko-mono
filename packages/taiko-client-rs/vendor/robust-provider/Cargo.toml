# Vendored production manifest; see PROVENANCE.md for the upstream source and local changes.
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
name = "robust-provider"
version = "1.0.2"
authors = ["OpenZeppelin"]
build = false
exclude = [
    ".github/",
    ".vscode/",
    ".config/",
    ".cargo/",
    "benches/",
    "tests/",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Robust Provider is a library for creating resilient RPC providers for EVM-based blockchains with automatic retries and failover support."
documentation = "https://docs.rs/robust-provider"
readme = "README.md"
keywords = [
    "evm",
    "ethereum",
    "blockchain",
    "rpc",
    "alloy",
]
categories = [
    "asynchronous",
    "web-programming",
    "web-programming::websocket",
    "cryptography::cryptocurrencies",
]
license = "MIT"
repository = "https://github.com/OpenZeppelin/Robust-Provider"

[package.metadata.docs.rs]
all-features = true

[features]
http-subscription = []
tracing = ["dep:tracing"]

[lib]
name = "robust_provider"
path = "src/lib.rs"

[dependencies.alloy]
version = "2.4.2"
features = [
    "pubsub",
    "json-rpc",
]

[dependencies.backon]
version = "1.6.0"

[dependencies.serde_json]
version = "1.0.149"

[dependencies.thiserror]
version = "2.0.17"

[dependencies.tokio]
version = "1.48"

[dependencies.tokio-stream]
version = "0.1.17"

[dependencies.tokio-util]
version = "0.7.17"

[dependencies.tracing]
version = "0.1"
optional = true
