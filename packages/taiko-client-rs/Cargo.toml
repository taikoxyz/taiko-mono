[workspace]
members = [
    "bin/client",
    "crates/abci",
    "crates/bindings",
    "crates/protocol",
    "crates/rpc",
    "crates/test-harness",
]
resolver = "2"

[workspace.package]
version = "2.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Taiko Labs"]
license = "MIT"
repository = "https://github.com/taikoxyz/taiko-mono"

[workspace.dependencies]
# async
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# cli
clap = { version = "4", features = ["derive", "env"] }

# observability
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# web
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "http1", "tokio"] }
tower = { version = "0.5", features = ["timeout", "util"] }

# ethereum
alloy = { version = "1.8.3", default-features = false }
alloy-consensus = { version = "1.8.3", default-features = false, features = [
    "serde",
] }
alloy-contract = { version = "1.8.3", default-features = false }
alloy-eips = { version = "1.8.3", default-features = false }
alloy-hardforks = { version = "0.4.7", default-features = false }
alloy-primitives = { version = "1.5.7", default-features = false }
alloy-provider = { version = "1.8.3", default-features = false }
alloy-rlp = { version = "0.3.15", default-features = false }
alloy-rpc-types = { version = "1.8.3", default-features = false }
alloy-rpc-types-engine = { version = "1.8.3", default-features = false }
alloy-rpc-types-engine-2 = { package = "alloy-rpc-types-engine", version = "2.0.4", default-features = false }
alloy-transport = { version = "1.8.3", default-features = false }
alloy-transport-http = { version = "1.8.3", features = ["hyper", "jwt-auth"] }
alloy-trie = { version = "0.9.5", default-features = false }
event-scanner = "1.1.1"
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
robust-provider = "1.0.1"

# taiko
alethia-reth-chainspec = { git = "https://github.com/taikoxyz/alethia-reth", package = "alethia-reth-chainspec", rev = "53d2cd81eb7dd271ef4eec693a14afc1a35ac12b", default-features = false }
alethia-reth-consensus = { git = "https://github.com/taikoxyz/alethia-reth", package = "alethia-reth-consensus", rev = "53d2cd81eb7dd271ef4eec693a14afc1a35ac12b", default-features = false }
alethia-reth-primitives = { git = "https://github.com/taikoxyz/alethia-reth", package = "alethia-reth-primitives", rev = "53d2cd81eb7dd271ef4eec693a14afc1a35ac12b", default-features = false, features = [
    "serde",
] }

# consensus
tendermint = "0.40"
tendermint-proto = "0.40"
tower-abci = "0.19"

# networking
axum = "0.7"

# types
anyhow = "1"
# Consensus decoding requires C zlib; the manifest tests cover backend-sensitive inputs.
flate2 = { version = "1.0", default-features = false, features = ["zlib"] }
once_cell = "1.19"
reqwest = { version = "0.13", features = ["json"] }
thiserror = { version = "2.0.12", default-features = false }
url = "2.5.4"

# serialization
prost = "0.13"
serde_json = "1"
toml = "0.9"

# testing
tempfile = "3"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package]
proptest.opt-level = 3
rand_chacha.opt-level = 3
rand_xorshift.opt-level = 3
unarray.opt-level = 3

[profile.release]
# Blob and manifest parsing perform arithmetic on attacker-controlled inputs; a silent wrap in
# production could turn a "reject payload" outcome into a wrong offset. The client is I/O-bound,
# so the runtime cost of keeping the checks is negligible.
overflow-checks = true

[profile.debug-fast]
inherits = "release"
debug = true
lto = "thin"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
