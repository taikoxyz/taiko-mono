[workspace]
members = [
    "bin/client",
    "crates/abci",
    "crates/bindings",
    "crates/lander",
    "crates/protocol",
    "crates/rpc",
    "crates/test-harness",
]
resolver = "2"

[workspace.package]
version = "2.3.0"
edition = "2024"
rust-version = "1.95"
authors = ["Taiko Labs"]
license = "MIT"
repository = "https://github.com/taikoxyz/taiko-mono"

[workspace.dependencies]
# async
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

# observability
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# web
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "http1", "tokio"] }
tower = { version = "0.5", features = ["timeout", "util"] }

# ethereum
alloy = { version = "2.4.2", default-features = false }
alloy-consensus = { version = "2.4.2", default-features = false, features = [
    "serde",
] }
alloy-contract = { version = "2.4.2", default-features = false }
alloy-eips = { version = "2.4.2", default-features = false }
alloy-hardforks = { version = "0.4.8", default-features = false }
alloy-primitives = { version = "1.6.1", default-features = false }
alloy-provider = { version = "2.4.2", default-features = false }
alloy-rlp = { version = "0.3.16", default-features = false }
alloy-rpc-types = { version = "2.4.2", default-features = false }
alloy-rpc-types-engine = { version = "2.4.2", default-features = false }
alloy-rpc-types-engine-2 = { package = "alloy-rpc-types-engine", version = "2.4.2", default-features = false }
alloy-signer-local = { version = "2.4.2", default-features = false }
alloy-transport = { version = "2.4.2", default-features = false }
alloy-transport-http = { version = "2.4.2", features = ["hyper", "jwt-auth"] }
alloy-trie = { version = "0.9.5", default-features = false }
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }

# taiko
alethia-reth-chainspec = { git = "https://github.com/taikoxyz/alethia-reth", package = "alethia-reth-chainspec", rev = "b046734a0a47b17ca66c33ccbc7c9087cbbf9b1e", default-features = false }
alethia-reth-consensus = { git = "https://github.com/taikoxyz/alethia-reth", package = "alethia-reth-consensus", rev = "b046734a0a47b17ca66c33ccbc7c9087cbbf9b1e", default-features = false }
alethia-reth-primitives = { git = "https://github.com/taikoxyz/alethia-reth", package = "alethia-reth-primitives", rev = "b046734a0a47b17ca66c33ccbc7c9087cbbf9b1e", default-features = false, features = [
    "serde",
] }

# consensus
tendermint = "0.40"
tendermint-proto = "0.40"
tower-abci = "0.19"

# networking
axum = "0.7"

# types
anyhow = "1"
# Consensus codecs use the locked, bundled stock zlib instead of the host library.
flate2 = { version = "1.0", default-features = false, features = ["zlib"] }
libz-sys = { version = "=1.1.28", default-features = false, features = ["static", "stock-zlib"] }
once_cell = "1.19"
reqwest = { version = "0.13", features = ["json"] }
thiserror = { version = "2.0.12", default-features = false }
url = "2.5.4"

# serialization
prost = "0.13"
serde_json = "1"
toml = "0.9"

# testing
base64 = "0.22"
curve25519-dalek = "4.1"
ed25519-consensus = "2.1"
ed25519-dalek = "2"
proptest = { version = "1.11", default-features = false, features = ["std"] }
sha2 = "0.10"
tempfile = "3"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package]
# Tests build and verify MPT proofs over thousands of slots; unoptimized hashing, U256 and trie
# code dominates them. The proptest and rand entries speed up input generation.
alloy-trie.opt-level = 3
hybrid-array.opt-level = 3
keccak.opt-level = 3
nybbles.opt-level = 3
proptest.opt-level = 3
rand_chacha.opt-level = 3
rand_xorshift.opt-level = 3
ruint.opt-level = 3
sha3.opt-level = 3
unarray.opt-level = 3

[profile.release]
# Blob and manifest parsing perform arithmetic on attacker-controlled inputs; a silent wrap in
# production could turn a "reject payload" outcome into a wrong offset. The client is I/O-bound,
# so the runtime cost of keeping the checks is negligible.
overflow-checks = true

[profile.debug-fast]
inherits = "release"
debug = true
lto = "thin"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1
incremental = false
