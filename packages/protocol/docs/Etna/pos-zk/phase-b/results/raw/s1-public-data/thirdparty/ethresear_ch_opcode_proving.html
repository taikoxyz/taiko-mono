        <script type="application/json" id="data-preloaded">{"topic_23955":"{\"post_stream\":{\"posts\":[{\"id\":58106,\"name\":\"Lin Oshitani\",\"username\":\"linoscope\",\"avatar_template\":\"/user_avatar/ethresear.ch/linoscope/{size}/13681_2.png\",\"created_at\":\"2026-01-27T12:32:05.776Z\",\"cooked\":\"\\u003cp\\u003e\\u003cdiv class=\\\"lightbox-wrapper\\\"\\u003e\\u003ca class=\\\"lightbox\\\" href=\\\"https://ethresear.ch/uploads/default/original/3X/d/0/d09cce60cfec40f23f6eb84e12a1a2355363ab63.jpeg\\\" data-download-href=\\\"https://ethresear.ch/uploads/default/d09cce60cfec40f23f6eb84e12a1a2355363ab63\\\" title=\\\"A picture of a prover proving blocks one opcode at a time\\\"\\u003e\\u003cimg src=\\\"https://ethresear.ch/uploads/default/optimized/3X/d/0/d09cce60cfec40f23f6eb84e12a1a2355363ab63_2_690x460.jpeg\\\" alt=\\\"A picture of a prover proving blocks one opcode at a time\\\" data-base62-sha1=\\\"tLtgI0eZK0nsJUDMP5QdLHjQPxF\\\" width=\\\"690\\\" height=\\\"460\\\" srcset=\\\"https://ethresear.ch/uploads/default/optimized/3X/d/0/d09cce60cfec40f23f6eb84e12a1a2355363ab63_2_690x460.jpeg, https://ethresear.ch/uploads/default/optimized/3X/d/0/d09cce60cfec40f23f6eb84e12a1a2355363ab63_2_1035x690.jpeg 1.5x, https://ethresear.ch/uploads/default/optimized/3X/d/0/d09cce60cfec40f23f6eb84e12a1a2355363ab63_2_1380x920.jpeg 2x\\\" data-dominant-color=\\\"D8D8D8\\\"\\u003e\\u003cdiv class=\\\"meta\\\"\\u003e\\u003csvg class=\\\"fa d-icon d-icon-far-image svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#far-image\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\"filename\\\"\\u003eA picture of a prover proving blocks one opcode at a time\\u003c/span\\u003e\\u003cspan class=\\\"informations\\\"\\u003e1536×1024 208 KB\\u003c/span\\u003e\\u003csvg class=\\\"fa d-icon d-icon-discourse-expand svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#discourse-expand\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eBy \\u003ca href=\\\"https://x.com/linoscope\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eLin Oshitani\\u003c/a\\u003e (\\u003ca href=\\\"https://www.nethermind.io/nethermind-research\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eNethermind Research\\u003c/a\\u003e).  Thanks to \\u003ca href=\\\"https://www.linkedin.com/in/matteolisotto/\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eMatteo\\u003c/a\\u003e, \\u003ca href=\\\"https://x.com/smartprogrammer\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eAhmad\\u003c/a\\u003e, \\u003ca href=\\\"https://x.com/mpfzajac\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eMichal\\u003c/a\\u003e, \\u003ca href=\\\"https://x.com/ConorMcMenamin9\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eConor\\u003c/a\\u003e,  \\u003ca href=\\\"https://x.com/gusgonzalezs\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eGustavo\\u003c/a\\u003e, \\u003ca href=\\\"https://x.com/realdantaik\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eDaniel\\u003c/a\\u003e,  \\u003ca href=\\\"https://github.com/davidtaikocha\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eDavid\\u003c/a\\u003e, Yuewang, and \\u003ca href=\\\"https://x.com/ignaciohagopian\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eIgnacio\\u003c/a\\u003e for the discussions and/or reviews, and thanks to \\u003ca href=\\\"https://x.com/wisemrmusa\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eMusa\\u003c/a\\u003e for the discussions and for helping run the benchmarks.\\u003c/p\\u003e\\n\\u003cp\\u003eThis work is funded by \\u003ca href=\\\"https://taiko.xyz/\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eTaiko\\u003c/a\\u003e as part of the \\u003ca href=\\\"https://paragraph.com/@taiko-labs/taiko-x-nethermind-building-ethereum-aligned-based-rollup-infrastructure\\\" rel=\\\"noopener nofollow ugc\\\"\\u003estrategic Taiko\\u0026lt;\\u0026gt;Nethermind partnership\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\"p-58106-tldr-1\\\" class=\\\"anchor\\\" href=\\\"#p-58106-tldr-1\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eTL;DR\\u003c/h1\\u003e\\n\\u003cp\\u003eWhat is each opcode’s isolated proving cost? To answer this question, we benchmark the per-gas proving time of individual EVM opcodes and precompiles in a multi-GPU setup, building on the EF’s zkEVM benchmarking tooling and the imapp team’s Gas Cost Estimator marginal method. We also evaluate whether zk cycles are a meaningful proxy for actual proving time using actual proving-time measurements.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\"p-58106-introduction-2\\\" class=\\\"anchor\\\" href=\\\"#p-58106-introduction-2\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eIntroduction\\u003c/h1\\u003e\\n\\u003cp\\u003eAs ZK rollups move toward further decentralization, both in terms of \\u003ca href=\\\"https://medium.com/l2beat/introducing-stages-a-framework-to-evaluate-rollups-maturity-d290bb22befe\\\" rel=\\\"noopener nofollow ugc\\\"\\u003erollup stages\\u003c/a\\u003e and in the decentralization of sequencers and provers, mitigating \\u003cem\\u003eprover-killer blocks\\u003c/em\\u003e becomes critical for their security and economic sustainability. These adversarial blocks are constructed to maximize proving time while remaining within the EVM gas limit, \\u003ca href=\\\"https://arxiv.org/abs/2509.17126\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ecreating potential denial-of-service vectors\\u003c/a\\u003e or rendering proving economically unviable. Moreover, as Ethereum L1 itself \\u003ca href=\\\"https://zkevm.ethereum.foundation/\\\" rel=\\\"noopener nofollow ugc\\\"\\u003emoves toward ZK-based scaling\\u003c/a\\u003e, it will face the same challenge.\\u003c/p\\u003e\\n\\u003cp\\u003eTraditional EVM gas metering accounts only for execution costs such as CPU time, storage access, and state growth, but it fails to capture proving costs altogether. As a result, ZK rollups require additional safeguards. A leading approach is to explicitly meter proving costs and enforce block limits based on this metric. Building such mechanisms, however, requires accurate models of how individual operations contribute to overall proving time, precise enough to prevent adversarial blocks without overly harming usability.\\u003c/p\\u003e\\n\\u003cp\\u003eTo model proving time, we focus on the following core question: \\u003cem\\u003ehow does each EVM opcode or precompile individually contribute to total proving time?\\u003c/em\\u003e Concretely, \\u003cem\\u003e\\u003cstrong\\u003eif we add a given opcode or precompile that consumes an additional X gas, holding all else equal, how much additional proving time does it add?\\u003c/strong\\u003e\\u003c/em\\u003e From this, we estimate the marginal proving time per unit of gas for each opcode or precompile.\\u003c/p\\u003e\\n\\u003cp\\u003ePrior \\u003ca href=\\\"https://eth-act.github.io/zkevm-benchmark-runs/benchmarks/\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ezkEVM benchmarking efforts\\u003c/a\\u003e by the Ethereum Foundation provide valuable end-to-end measurements by constructing blocks densely filled with a specific opcode or precompile via a loop. This approach works well for identifying and analyzing operations with very high proving cost, where the cost of the target operation dominates overall proving time. However, because these benchmarks do not explicitly separate per-operation cost from the surrounding overhead (e.g., pushing arguments to the stack, popping return values, and control flow), they are less informative for lower-cost operations, where the surrounding code can significantly affect the measurement. As a result, they are insufficient for building a comprehensive model of proving time across all opcodes and precompiles.\\u003c/p\\u003e\\n\\u003cp\\u003eTo overcome this limitation, we adopt the \\u003cem\\u003emarginal\\u003c/em\\u003e measurement approach from the imapp team’s \\u003ca href=\\\"https://github.com/imapp-pl/gas-cost-estimator/\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eGas Cost Estimator\\u003c/a\\u003e project, which isolates the contribution of each opcode or precompile from surrounding overhead by creating test cases that vary only the target operation count while holding all other execution context constant. We then fit a linear regression and take the slope to estimate the proving time per unit of gas.\\u003c/p\\u003e\\n\\u003cp\\u003eOur benchmark implementation is built on and made possible by the foundation of the Ethereum Foundation’s \\u003ca href=\\\"https://github.com/eth-act/zkevm-benchmark-workload\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ezkEVM Benchmarking Workload\\u003c/a\\u003e tooling. We created \\u003ca href=\\\"https://github.com/linoscope/execution-specs/pull/1/changes\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ea suite of custom execution-spec tests\\u003c/a\\u003e following the gas-cost-estimator’s marginal methodology, with extensions to better fit the ZK proving context (e.g., an amplification method to prevent fixed ZK proving setup overhead from dominating the measurements). These fixtures were then executed using a \\u003ca href=\\\"https://github.com/NethermindEth/ere/pull/1\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ecustom fork\\u003c/a\\u003e of EF’s benchmarking tooling with multi-GPU support added for SP1.\\u003c/p\\u003e\\n\\u003cp\\u003eFurthermore, we use the benchmarking results to evaluate whether zk cycles are a meaningful proxy for actual proving time using direct proving-time measurements. We find that the relationship between proving time and zk cycles varies widely across opcodes and precompiles, limiting the accuracy of zk cycle-based estimates.\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\"p-58106-key-results-3\\\" class=\\\"anchor\\\" href=\\\"#p-58106-key-results-3\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eKey Results\\u003c/h1\\u003e\\n\\u003cp\\u003e\\u003cem\\u003eWe present the results first; readers interested in assumptions and experimental setup can find details in the  \\u003ca href=\\\"#methodology\\\"\\u003eMethodology section\\u003c/a\\u003e.\\u003c/em\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eIn this section, we present the key results of the benchmarks, which were run in the following environment (for more details on the setup, see the methodology section below).:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eProver\\u003c/strong\\u003e: sp1-v5.2.3 (with sp1-cluster) and risc0-v3.0.4 (with \\u003ccode\\u003eRISC0_KECCAK_PO2=15\\u003c/code\\u003e flag to prevent provers from crashing)\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eGPUs\\u003c/strong\\u003e: 4 x NVIDIA GeForce RTX 4090\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eExecution Client:\\u003c/strong\\u003e reth-v1.9.3\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eNote:\\u003c/strong\\u003e Proving time depends heavily on the run configuration (e.g., prover flags and configurations, hardware/runtime settings, the condition of GPUs at the time of proving, etc.). As such, these results should be interpreted as configuration-specific measurements.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eNote:\\u003c/strong\\u003e These benchmarks were run without block header validation. Local testing suggests validation has little effect on most opcodes; LOG-related opcodes see a 4–5× increase, though they remain relatively cheap to prove.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-58106-proving-time-per-gas-4\\\" class=\\\"anchor\\\" href=\\\"#p-58106-proving-time-per-gas-4\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eProving Time per Gas\\u003c/h2\\u003e\\n\\u003cp\\u003eBelow is the “proving time per gas” for each opcode/precompile in both SP1 and RISC0. This metric represents the additional proving time incurred by using 1 additional gas unit for a specific opcode or precompile. The R^2 value indicates the fit of the linear regression.\\u003c/p\\u003e\\n\\u003cp\\u003eMore detailed data (e.g., regression plot for each opcode) is hosted here: \\u003ca href=\\\"https://nethermindeth.github.io/zkevm-benchmark-workload/marginal-gas-benchmark/sp1\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eSP1\\u003c/a\\u003e, \\u003ca href=\\\"https://nethermindeth.github.io/zkevm-benchmark-workload/marginal-gas-benchmark/risc0\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eRISC0\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\"lightbox-wrapper\\\"\\u003e\\u003ca class=\\\"lightbox\\\" href=\\\"https://ethresear.ch/uploads/default/original/3X/2/d/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2.jpeg\\\" data-download-href=\\\"https://ethresear.ch/uploads/default/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2\\\" title=\\\"Proving Time per Gas\\\"\\u003e\\u003cimg src=\\\"https://ethresear.ch/uploads/default/optimized/3X/2/d/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2_2_258x500.jpeg\\\" alt=\\\"Proving Time per Gas\\\" data-base62-sha1=\\\"6vbJvNY1PD87gXLOabbv1eztDgK\\\" width=\\\"258\\\" height=\\\"500\\\" srcset=\\\"https://ethresear.ch/uploads/default/optimized/3X/2/d/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2_2_258x500.jpeg, https://ethresear.ch/uploads/default/optimized/3X/2/d/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2_2_387x750.jpeg 1.5x, https://ethresear.ch/uploads/default/optimized/3X/2/d/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2_2_516x1000.jpeg 2x\\\" data-dominant-color=\\\"F9F9F8\\\"\\u003e\\u003cdiv class=\\\"meta\\\"\\u003e\\u003csvg class=\\\"fa d-icon d-icon-far-image svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#far-image\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\"filename\\\"\\u003eProving Time per Gas\\u003c/span\\u003e\\u003cspan class=\\\"informations\\\"\\u003e1781×3448 321 KB\\u003c/span\\u003e\\u003csvg class=\\\"fa d-icon d-icon-discourse-expand svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#discourse-expand\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eSome preliminary observations:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eCryptographic precompiles (e.g., \\u003ccode\\u003emodexp\\u003c/code\\u003e, \\u003ccode\\u003epoint_evaluation\\u003c/code\\u003e) in general have high per-gas proving time.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eMod/division-related opcodes (\\u003ccode\\u003emulmod\\u003c/code\\u003e, \\u003ccode\\u003emod\\u003c/code\\u003e, \\u003ccode\\u003ediv\\u003c/code\\u003e, \\u003ccode\\u003esdiv\\u003c/code\\u003e) have relatively high proving time, as well as \\u003ccode\\u003eselfbalance\\u003c/code\\u003e.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eOpcodes around log/create (\\u003ccode\\u003elog1\\u003c/code\\u003e, \\u003ccode\\u003elog2\\u003c/code\\u003e, \\u003ccode\\u003elog3\\u003c/code\\u003e, \\u003ccode\\u003ecreate\\u003c/code\\u003e, \\u003ccode\\u003ecreate2\\u003c/code\\u003e) have the fastest per-gas proving time for both SP1 and RISC0, likely because their gas costs are dominated by data and storage rather than computation.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eIn general, the relative ranking of opcodes by proving time is similar between RISC0 and SP1, but there are several notable exceptions (e.g., \\u003ccode\\u003ekeccak256\\u003c/code\\u003e is ~12x slower in RISC0, \\u003ccode\\u003esha256\\u003c/code\\u003e is ~10x times faster in RISC0). This is likely due to zkvm precompiles of certain opcodes/precompiles existing in one but not the other (for more comparison between the provers, see the chart in \\u003ca href=\\\"#appendix-sp1risc0-comparison\\\"\\u003eAppendix: SP1/RISC0 Comparison\\u003c/a\\u003e ).\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-58106-proving-time-per-zk-cycle-5\\\" class=\\\"anchor\\\" href=\\\"#p-58106-proving-time-per-zk-cycle-5\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eProving Time per ZK Cycle\\u003c/h2\\u003e\\n\\u003cp\\u003eZKVMs have the concept of \\u003cem\\u003eZK cycles\\u003c/em\\u003e, which represent the number of computational steps the ZKVM executes to prove a program, analogous to CPU cycles in traditional computing. A natural question is: how good a proxy are ZK cycles for actual proving time? If ZK cycles correlate linearly with proving time across all operations, they could serve as a simpler metric for ZK gas metering. However, if the relationship is non-linear or varies significantly across operation types, then proving time must be measured directly for accurate DoS protection.\\u003c/p\\u003e\\n\\u003cp\\u003eTo answer this question, we fit a linear regression of proving time against zk cycles for each opcode/precompile. Below are the findings.\\u003c/p\\u003e\\n\\u003cp\\u003eWithin a given operation, the relationship is strongly linear (high R^2): doubling cycles roughly doubles proving time. But the conversion rate from cycles to time is not universal—it depends heavily on the operation.\\u003c/p\\u003e\\n\\u003cp\\u003eThe bar chart below shows this per-operation “time per zk cycle.” If cycles were a good proxy, all bars would largely align; instead, they spread widely—likely because some operations are implemented in different circuits (e.g., custom zkVM precompiles). For example, in SP1, \\u003ccode\\u003ebn128_add\\u003c/code\\u003e takes ~930 ns per zk cycle while \\u003ccode\\u003epop\\u003c/code\\u003e takes only ~63 ns, a ~15× gap. This suggests zk cycles alone are insufficient for accurate metering of proving time. Mitigations include:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eMeter using measured proving time (as done in this post)\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eImprove cycle accounting to better reflect proving time (e.g., improve zk cycle conversion between different circuits)\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eUse ZK cycles as a proving time proxy, but be conservative, i.e., use numbers from the slowest time per ZK cycle operation.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\"lightbox-wrapper\\\"\\u003e\\u003ca class=\\\"lightbox\\\" href=\\\"https://ethresear.ch/uploads/default/original/3X/e/c/ec01872733e150805129ab95e610ee2257970a36.jpeg\\\" data-download-href=\\\"https://ethresear.ch/uploads/default/ec01872733e150805129ab95e610ee2257970a36\\\" title=\\\"Proving TIme per ZK Cycle\\\"\\u003e\\u003cimg src=\\\"https://ethresear.ch/uploads/default/optimized/3X/e/c/ec01872733e150805129ab95e610ee2257970a36_2_258x500.jpeg\\\" alt=\\\"Proving TIme per ZK Cycle\\\" data-base62-sha1=\\\"xFNXjgSdpI0SJ0RCbrjH1TT8k7A\\\" width=\\\"258\\\" height=\\\"500\\\" srcset=\\\"https://ethresear.ch/uploads/default/optimized/3X/e/c/ec01872733e150805129ab95e610ee2257970a36_2_258x500.jpeg, https://ethresear.ch/uploads/default/optimized/3X/e/c/ec01872733e150805129ab95e610ee2257970a36_2_387x750.jpeg 1.5x, https://ethresear.ch/uploads/default/optimized/3X/e/c/ec01872733e150805129ab95e610ee2257970a36_2_516x1000.jpeg 2x\\\" data-dominant-color=\\\"F3EFE7\\\"\\u003e\\u003cdiv class=\\\"meta\\\"\\u003e\\u003csvg class=\\\"fa d-icon d-icon-far-image svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#far-image\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\"filename\\\"\\u003eProving TIme per ZK Cycle\\u003c/span\\u003e\\u003cspan class=\\\"informations\\\"\\u003e1783×3448 419 KB\\u003c/span\\u003e\\u003csvg class=\\\"fa d-icon d-icon-discourse-expand svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#discourse-expand\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\"p-58106-methodology-6\\\" class=\\\"anchor\\\" href=\\\"#p-58106-methodology-6\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eMethodology\\u003c/h1\\u003e\\n\\u003cp\\u003eWe adopt a marginal-cost approach, \\u003ca href=\\\"https://github.com/imapp-pl/gas-cost-estimator/blob/07c5af9d5b53cb0dd8e9054b41aaef4e3caa4ff8/docs/report_stage_ii.md\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eoriginally developed\\u003c/a\\u003e by the imapp team for L1 gas repricing as part of the Gas Cost Estimator project, to isolate the proving cost of individual operations.\\u003c/p\\u003e\\n\\u003cp\\u003eFirst, we create 4-7 blocks for each opcode/precompile with varying operation counts (0, N, 2N, 3N, etc.), while maintaining constant overhead by keeping all other factors identical across variants—stack setup, memory initialization, control flow, and cleanup operations.\\u003c/p\\u003e\\n\\u003cp\\u003eThe table below is an example bytecode structure for the ADD opcode. Notice that each variant has exactly 20 PUSHes and 10 POPs—Only the ADD count varies.\\u003c/p\\u003e\\n\\u003cdiv class=\\\"md-table\\\"\\u003e\\n\\u003ctable\\u003e\\n\\u003cthead\\u003e\\n\\u003ctr\\u003e\\n\\u003cth\\u003eop_count\\u003c/th\\u003e\\n\\u003cth\\u003eSetup\\u003c/th\\u003e\\n\\u003cth\\u003eMain\\u003c/th\\u003e\\n\\u003cth\\u003eCleanup\\u003c/th\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/thead\\u003e\\n\\u003ctbody\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e0\\u003c/td\\u003e\\n\\u003ctd\\u003ePUSH×20\\u003c/td\\u003e\\n\\u003ctd\\u003e—\\u003c/td\\u003e\\n\\u003ctd\\u003ePOP×10\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e3\\u003c/td\\u003e\\n\\u003ctd\\u003ePUSH×20\\u003c/td\\u003e\\n\\u003ctd\\u003eADD + (POP + ADD)×2\\u003c/td\\u003e\\n\\u003ctd\\u003ePOP×8\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e5\\u003c/td\\u003e\\n\\u003ctd\\u003ePUSH×20\\u003c/td\\u003e\\n\\u003ctd\\u003eADD + (POP + ADD)×4\\u003c/td\\u003e\\n\\u003ctd\\u003ePOP×6\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e10\\u003c/td\\u003e\\n\\u003ctd\\u003ePUSH×20\\u003c/td\\u003e\\n\\u003ctd\\u003eADD + (POP + ADD)×9\\u003c/td\\u003e\\n\\u003ctd\\u003ePOP×1\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/tbody\\u003e\\n\\u003c/table\\u003e\\n\\u003c/div\\u003e\\u003cp\\u003eNext, we execute each block variant and record the total proving time and gas consumed by the whole block. Then, we fit \\u003ccode\\u003eproving_time = α × gas_used + β\\u003c/code\\u003e across all variants. Here is an example for the ADD opcode in SP1:\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\"lightbox-wrapper\\\"\\u003e\\u003ca class=\\\"lightbox\\\" href=\\\"https://ethresear.ch/uploads/default/original/3X/e/4/e4bd04b4f9042e3be13f838fb3540f2b89b02709.png\\\" data-download-href=\\\"https://ethresear.ch/uploads/default/e4bd04b4f9042e3be13f838fb3540f2b89b02709\\\" title=\\\"\\\"\\u003e\\u003cimg src=\\\"https://ethresear.ch/uploads/default/optimized/3X/e/4/e4bd04b4f9042e3be13f838fb3540f2b89b02709_2_690x427.png\\\" alt=\\\"\\\" data-base62-sha1=\\\"wDvPF9Lw4EUCtnHvEiZTWt1OADD\\\" width=\\\"690\\\" height=\\\"427\\\" role=\\\"presentation\\\" srcset=\\\"https://ethresear.ch/uploads/default/optimized/3X/e/4/e4bd04b4f9042e3be13f838fb3540f2b89b02709_2_690x427.png, https://ethresear.ch/uploads/default/original/3X/e/4/e4bd04b4f9042e3be13f838fb3540f2b89b02709.png 1.5x, https://ethresear.ch/uploads/default/original/3X/e/4/e4bd04b4f9042e3be13f838fb3540f2b89b02709.png 2x\\\" data-dominant-color=\\\"FBFAFA\\\"\\u003e\\u003cdiv class=\\\"meta\\\"\\u003e\\u003csvg class=\\\"fa d-icon d-icon-far-image svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#far-image\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\"filename\\\"\\u003e\\u003c/span\\u003e\\u003cspan class=\\\"informations\\\"\\u003e790×489 24.7 KB\\u003c/span\\u003e\\u003csvg class=\\\"fa d-icon d-icon-discourse-expand svg-icon\\\" aria-hidden=\\\"true\\\"\\u003e\\u003cuse href=\\\"#discourse-expand\\\"\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThe slope \\u003ccode\\u003eα\\u003c/code\\u003e represents the marginal proving time per unit of gas for the opcode or precompile under consideration. Because only the target operation count varies while all other execution context is held constant, \\u003ccode\\u003eα\\u003c/code\\u003e isolates the contribution of that operation. In the example above, we have \\u003ccode\\u003eα = 3.78µs\\u003c/code\\u003e, implying a per-gas proving time of \\u003ccode\\u003e3.78µs\\u003c/code\\u003e for ADD in SP1 with 4 GPUs.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-58106-opcodeprecompile-arguments-7\\\" class=\\\"anchor\\\" href=\\\"#p-58106-opcodeprecompile-arguments-7\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eOpcode/Precompile Arguments\\u003c/h2\\u003e\\n\\u003cp\\u003eFor opcode/precompile arguments, we use fixed inputs chosen to be representative and, where applicable, “worst‑case” on a best‑effort basis. Our choices are guided by known worst-case patterns from \\u003ca href=\\\"https://eth-act.github.io/zkevm-benchmark-runs/benchmarks/\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eexisting benchmarking suites\\u003c/a\\u003e. Using worst-case inputs helps avoid inadvertently measuring optimized fast paths that occur only for special inputs (e.g., all-zero buffers).\\u003c/p\\u003e\\n\\u003cp\\u003eOur working assumption is that proving time scales linearly with gas consumption for a given operation, not only across different operation counts, but also across different argument choices within the same operation (i.e., if you double the gas, you double the proving time). This assumes that (1) gas accurately reflects computational complexity, and (2) proving time scales proportionally with that complexity.\\u003c/p\\u003e\\n\\u003cp\\u003eIn practice, this assumption can fail, e.g., because gas does not accurately reflect computation complexity or because ZKVMs exhibit different behavior for certain arguments. Our measurements should therefore be interpreted as specific to the tested inputs and only as approximations for other inputs. A more fine-grained analysis of argument-dependent proving costs, examining how proving time varies across the whole argument space for each operation, is left for future work.\\u003c/p\\u003e\\n\\u003cp\\u003eFinally, for operations like LOG and CREATE, where gas is primarily driven by data size and memory expansion rather than computation, we use standard arguments (e.g., 32-byte payloads) and not worst-case arguments in terms of gas. Using large payloads would inflate gas costs without meaningfully increasing proving work, underestimating the computational proving overhead per gas unit.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\u003ca name=\\\"p-58106-integration-with-ef-benchmarking-tooling-8\\\" class=\\\"anchor\\\" href=\\\"#p-58106-integration-with-ef-benchmarking-tooling-8\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eIntegration with EF Benchmarking Tooling\\u003c/h2\\u003e\\n\\u003cp\\u003eOur benchmarking pipeline builds on the Ethereum Foundation’s \\u003ca href=\\\"https://github.com/eth-act/zkevm-benchmark-workload\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ezkEVM Benchmarking Workload\\u003c/a\\u003e, and we introduce two key extensions:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eCustom EEST marginal tests/fixtures\\u003c/strong\\u003e: We add \\u003ca href=\\\"https://github.com/linoscope/execution-specs/pull/1/changes\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ecustom execution-spec-tests\\u003c/a\\u003e (EEST) that follow the marginal methodology.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eMulti-GPU SP1 support\\u003c/strong\\u003e: We \\u003ca href=\\\"https://github.com/NethermindEth/ere/pull/1\\\" rel=\\\"noopener nofollow ugc\\\"\\u003eextend\\u003c/a\\u003e the EF’s ZKEVM benchmark tooling to support SP1 cluster execution, allowing the same workload to be proven using 4 GPUs.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eWith these additions, we generate EEST fixtures, convert them to zkEVM witness inputs using the EF tooling, run proving through the EF host runner (SP1 on 4 GPUs or RISC0), and then post-process the resulting metrics (proving time, gas, zk cycles) to fit regressions and extract marginal proving time per gas (or per zk cycles).\\u003c/p\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\"p-58106-applications-next-steps-9\\\" class=\\\"anchor\\\" href=\\\"#p-58106-applications-next-steps-9\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eApplications \\u0026amp; Next Steps\\u003c/h1\\u003e\\n\\u003cp\\u003eHere are some potential practical applications of these measurements:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eZK-aware block metering for ZK rollups\\u003c/strong\\u003e: The per-gas proving-time measurements can be used to directly meter and cap the proving cost of blocks. Concretely, one can define a “ZK Gas” metric by weighting the gas consumed by each opcode/precompile with a multiplier derived from its measured proving-time-per-gas. By capping the total ZK Gas per block, the protocol can cap worst-case proving time and mitigate prover-killer blocks.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eGuidance for zkVM implementers\\u003c/strong\\u003e: The per-operation breakdown highlights which opcodes/precompiles need improvements, helping zkVM teams prioritize optimizations (e.g., specialized circuits). It also provides a concrete signal for improving ZK cycle accounting so that the ZK cycle number tracks proving time more uniformly across different circuit paths.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eGuidance for client implementers\\u003c/strong\\u003e: Client teams can use these measurements to identify ZK-unfriendly hotspots and optimize specific opcode/precompile implementations or execution patterns to reduce proving overhead.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eFor the next steps of the project:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eArgument-dependent benchmarking\\u003c/strong\\u003e: Extend the methodology to sweep across all inputs.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eContinuous performance monitoring\\u003c/strong\\u003e: Automate the pipeline end-to-end (fixture generation → witness generation → proving → regression → reporting) so per-opcode/precompile zkVM/client performance can be tracked over time.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eMulti-dimensional metering\\u003c/strong\\u003e: Investigate how these measurements can be incorporated into \\u003ca href=\\\"https://eips.ethereum.org/EIPS/eip-7999\\\" rel=\\\"noopener nofollow ugc\\\"\\u003emulti-dimensional gas metering\\u003c/a\\u003e.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\"p-58106-links-10\\\" class=\\\"anchor\\\" href=\\\"#p-58106-links-10\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eLinks\\u003c/h1\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eDetailed data of our benchmarks (e.g., regression plot for each opcode/precompile):\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eSP1: \\u003ca href=\\\"https://nethermindeth.github.io/zkevm-benchmark-workload/marginal-gas-benchmark/sp1\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ehttps://nethermindeth.github.io/zkevm-benchmark-workload/marginal-gas-benchmark/sp1\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eRISC0: \\u003ca href=\\\"https://nethermindeth.github.io/zkevm-benchmark-workload/marginal-gas-benchmark/risc0/\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ehttps://nethermindeth.github.io/zkevm-benchmark-workload/marginal-gas-benchmark/risc0/\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eCustom execution-spec tests used for the benchmarks: \\u003ca href=\\\"https://github.com/linoscope/execution-specs/pull/1/changes\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ehttps://github.com/linoscope/execution-specs/pull/1/changes\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003ePRs for SP1 cluster support in EF tooling:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://github.com/NethermindEth/ere/pull/1\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ehttps://github.com/NethermindEth/ere/pull/1\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003ca href=\\\"https://github.com/NethermindEth/zkevm-benchmark-workload/pull/14\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ehttps://github.com/NethermindEth/zkevm-benchmark-workload/pull/14\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eNice talk about EF’s ZK Benchmark Tooling by Ignacio: \\u003ca href=\\\"https://youtu.be/D2TpmD62tjQ?si=D4mzEagb2MXX1QXy\\u0026amp;t=1510\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ehttps://youtu.be/D2TpmD62tjQ?si=D4mzEagb2MXX1QXy\\u0026amp;t=1510\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eNice talk about the marginal approach by Jacek: \\u003ca href=\\\"https://www.youtube.com/watch?v=KmaFpyV9jvM\\\" rel=\\\"noopener nofollow ugc\\\"\\u003ehttps://www.youtube.com/watch?v=KmaFpyV9jvM\\u003c/a\\u003e\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003ch1\\u003e\\u003ca name=\\\"p-58106-appendix-sp1risc0-comparison-11\\\" class=\\\"anchor\\\" href=\\\"#p-58106-appendix-sp1risc0-comparison-11\\\" aria-label=\\\"Heading link\\\"\\u003e\\u003c/a\\u003eAppendix: SP1/RISC0 Comparison\\u003c/h1\\u003e\\n\\u003cp\\u003eThe graph below shows the \\u003ccode\\u003e(RISC0 proving_time_per_gas) / (SP1 proving_time_per_gas)\\u003c/code\\u003e, where \\u003ccode\\u003eproving_time_per_gas\\u003c/code\\u003e is the regression slope for the opcode for each prover. The reference line at 1.0× means equal performance. Values \\u0026gt; 1.0× indicate RISC0 is slower (takes more proving time per gas than SP1 for that opcode/precompile), and values \\u0026lt; 1.0× indicate SP1 is slower.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\"lightbox-wrapper\\\"\\u003e\\u003ca class=\\\"lightbox\\\" href=\\\"https://ethresear.ch/uploads/default/original/3X/e/1/e1679409b130a7f230dd46d2874f6b36a678d073.png\\\" data-download-href=\\\"https://ethresear.ch/uploads/default/e1679409b130a7f230dd46d2874f6b36a678d073\\\" title=\\\"\\\"\\u003e\\u003cimg src=\\\"https://ethresear.ch/uploads/default/optimized/3X/e/1/e1679409b130a7f230dd46d2874f6b36a678d073_2_162x500.png\\\" alt=\\\"\\\" data-base62-sha1=\\\"wa1lt5yS7nVnEdrHqDxZz2mScn1\\\" width=\\\"162\\\" height=\\\"500\\\" role=\\\"presentation\\\" srcset=\\\"https://ethresear.ch/uploads/default/optimized/3X/e/1/e1679409b130a7f230dd46d2874f6b36a678d073_2_162x500.png, https://ethresear.ch/uploads/default/optimized/3X/e/1/e1679409b130a7f230dd46d2874f6b36a678d073_2_243x750.png 1.5x, https://ethresear.ch/uploads/default/optimized/3X/e/1/e1679409b130a7f230dd46d2874f6b36a678d073_2_324x1000.png 2x\\\" data-dominant-color=\\\"E9F3FB\\\"\\u003e\\u003cdiv class=\\\"meta\\\"\\u003e\\u003csvg class=\\\"fa d-icon d-ic nal\":false,\"reflection\":false,\"clicks\":1},{\"url\":\"https://www.youtube.com/watch?v=KmaFpyV9jvM\",\"internal\":false,\"reflection\":false,\"clicks\":1},{\"url\":\"https://taiko.xyz/\",\"internal\":false,\"reflection\":false,\"clicks\":1},{\"url\":\"https://x.com/wisemrmusa\",\"internal\":false,\"reflection\":false,\"clicks\":1},{\"url\":\"https://x.com/smartprogrammer\",\"internal\":false,\"reflection\":false,\"clicks\":0},{\"url\":\"https://medium.com/l2beat/introducing-stages-a-framework-to-evaluate-rollups-maturity-d290bb22befe\",\"internal\":false,\"reflection\":false,\"clicks\":0},{\"url\":\"https://arxiv.org/abs/2509.17126\",\"internal\":false,\"reflection\":false,\"title\":\"[2509.17126] Unaligned Incentives: Pricing Attacks Against Blockchain Rollups\",\"clicks\":0},{\"url\":\"https://zkevm.ethereum.foundation/\",\"internal\":false,\"reflection\":false,\"title\":\"zkEVM - Scaling Ethereum Without Compromise\",\"clicks\":0},{\"url\":\"https://github.com/linoscope/execution-specs/pull/1/changes\",\"internal\":false,\"reflection\":false,\"title\":\"Marignal zk benchmarks by linoscope · Pull Request #1 · linoscope/execution-specs · GitHub\",\"clicks\":0},{\"url\":\"https://eips.ethereum.org/EIPS/eip-7999\",\"internal\":false,\"reflection\":false,\"title\":\"EIP-7999: Unified multidimensional fee market\",\"clicks\":0},{\"url\":\"https://github.com/NethermindEth/zkevm-benchmark-workload/pull/14\",\"internal\":false,\"reflection\":false,\"title\":\"feat: activate sp1 cluster proving by WiseMrMusa · Pull Request #14 · NethermindEth/zkevm-benchmark-workload · GitHub\",\"clicks\":0},{\"url\":\"https://ethresear.ch/t/same-instruction-count-23x-the-wall-clock-working-set-effects-in-a-deterministic-risc-v-interpreter/25856\",\"internal\":true,\"reflection\":true,\"title\":\"Same instruction count, 23x the wall clock: working-set effects in a deterministic RISC-V interpreter\",\"clicks\":0}],\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":8}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":10476,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":\"Github link was replaced with a permanent link\",\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/measuring-per-opcode-proving-time/23955/1\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":8}],\"current_user_reaction\":null,\"reaction_users_count\":8,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null,\"can_vote\":false},{\"id\":58131,\"name\":\"Jochem Brouwer\",\"username\":\"jochem-brouwer\",\"avatar_template\":\"/user_avatar/ethresear.ch/jochem-brouwer/{size}/19918_2.png\",\"created_at\":\"2026-01-28T21:56:07.430Z\",\"cooked\":\"\\u003cp\\u003eHey, very nice report, we are working on similar benchmarks reports but now for the current “classic” (?) EL architecture in the context of gas repricing.\\u003c/p\\u003e\\n\\u003cp\\u003eSome questions:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eI do not see \\u003ccode\\u003eBLOCKHASH\\u003c/code\\u003e opcode. I know this is a rather “special” opcode as pre-EIP-2935 you need to do a database inspection (now you can do a storage read from the EIP-2935 contract). Is there a specific reason why this opcode is not in these zk benchs?\\u003c/li\\u003e\\n\\u003cli\\u003eAFAIK the difference between SHA256 and KECCAK256 is only a few constants. The difference (as mentioned in your report) is huge here. This should however be somewhat easy (?) to solve? I am mainly baffled by this huge difference (but, I’m a super novice to the zk-world so I’m treating those as black box)\\u003c/li\\u003e\\n\\u003cli\\u003eYou mention argument-dependent benchmarking. For the EL side we have, especially for the ModExp precompile, really went in the rabbit hole to construct the worst case inputs to get the worst case execution time, per client (as this depends on the implementation of that precompile and certain assumptions/optimizations). I assume that the “worst case” situations for zkVMs might be different than those in “classic” VMs (live VMs as executed now). How would one find these worst case situations and is there any way we can help in this effort?\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eThanks \\u003cimg src=\\\"https://ethresear.ch/images/emoji/facebook_messenger/smiley.png?v=14\\\" title=\\\":smiley:\\\" class=\\\"emoji\\\" alt=\\\":smiley:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e \\u003cimg src=\\\"https://ethresear.ch/images/emoji/facebook_messenger/+1.png?v=14\\\" title=\\\":+1:\\\" class=\\\"emoji\\\" alt=\\\":+1:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e\\u003c/p\\u003e\",\"post_number\":2,\"post_type\":1,\"posts_count\":3,\"updated_at\":\"2026-01-28T21:56:07.430Z\",\"reply_count\":1,\"reply_to_post_number\":null,\"quote_count\":0,\"incoming_link_count\":0,\"reads\":17,\"readers_count\":16,\"score\":38.4,\"yours\":false,\"topic_id\":23955,\"topic_slug\":\"measuring-per-opcode-proving-time\",\"display_username\":\"Jochem Brouwer\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":2}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":2936,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/measuring-per-opcode-proving-time/23955/2\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":2}],\"current_user_reaction\":null,\"reaction_users_count\":2,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null},{\"id\":58136,\"name\":\"Lin Oshitani\",\"username\":\"linoscope\",\"avatar_template\":\"/user_avatar/ethresear.ch/linoscope/{size}/13681_2.png\",\"created_at\":\"2026-01-29T05:14:08.815Z\",\"cooked\":\"\\u003cp\\u003eThanks for the comment \\u0026amp; questions!\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eI do not see \\u003ccode\\u003eBLOCKHASH\\u003c/code\\u003e opcode. I know this is a rather “special” opcode as pre-EIP-2935 you need to do a database inspection (now you can do a storage read from the EIP-2935 contract). Is there a specific reason why this opcode is not in these zk benchs?\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eGood find! Actually, this was accidental, I ran this run with blockhash commented out \\u003cimg src=\\\"https://ethresear.ch/images/emoji/facebook_messenger/sweat_smile.png?v=14\\\" title=\\\":sweat_smile:\\\" class=\\\"emoji\\\" alt=\\\":sweat_smile:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e . But from previous runs, blockchash didn’t really stand out, its per-gas proving time was around the same as the PUSH opcodes.\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eAFAIK the difference between SHA256 and KECCAK256 is only a few constants. The difference (as mentioned in your report) is huge here. This should however be somewhat easy (?) to solve? I am mainly baffled by this huge difference (but, I’m a super novice to the zk-world so I’m treating those as black box)\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eYeah, was surprised to see this too (I am also no expert in zkvms or ZK/cryptography in general, so it’s a black box too \\u003cimg src=\\\"https://ethresear.ch/images/emoji/facebook_messenger/slightly_smiling_face.png?v=14\\\" title=\\\":slightly_smiling_face:\\\" class=\\\"emoji\\\" alt=\\\":slightly_smiling_face:\\\" loading=\\\"lazy\\\" width=\\\"20\\\" height=\\\"20\\\"\\u003e ). From the data, I can see that:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eThe huge difference is only in RISC0, in SP1 it’s more consistent.\\u003c/li\\u003e\\n\\u003cli\\u003eThe RISC0 per-gas proving time for \\u003ccode\\u003eSHA256\\u003c/code\\u003e is 10 times faster than SP1’s.\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eSo maybe RISC0 has some strong optimization specifically for SHA256?\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eI assume that the “worst case” situations for zkVMs might be different than those in “classic” VMs (live VMs as executed now)\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eOne thing I wonder is whether the “worst case” for zkVMs is fundamentally different from that of classic VMs. If classic gas accurately reflects execution time, and proving time scales proportionally with execution, then in principle the same benchmark models could carry over to the ZK setting, or ZK metering could even be done through a simple multiplier on execution gas. That said, zkVM implementations can have quirks that make proving time respond differently to argument changes than execution time. So definitely still worth testing ZK separately.\\u003c/p\\u003e\\n\\u003cblockquote\\u003e\\n\\u003cp\\u003eHow would one find these worst case situations and is there any way we can help in this effort?\\u003c/p\\u003e\\n\\u003c/blockquote\\u003e\\n\\u003cp\\u003eTbh haven’t put too much thought on it so far - You probably need to model proving time in terms of arguments and fit is using actual benchmarks. I assume we will need similar effort for “classic” VM execution, and that it will be applicable to ZK setting too (actually, Ignacio made a good point that we should just have one benchmark suite both for ZK and execution, which makes sense). So looking forward to what you all do here, and also happy to help out in any way too!\\u003c/p\\u003e\",\"post_number\":3,\"post_type\":1,\"posts_count\":3,\"updated_at\":\"2026-01-29T05:14:08.815Z\",\"reply_count\":0,\"reply_to_post_number\":2,\"quote_count\":0,\"incoming_link_count\":2,\"reads\":17,\"readers_count\":16,\"score\":28.4,\"yours\":false,\"topic_id\":23955,\"topic_slug\":\"measuring-per-opcode-proving-time\",\"display_username\":\"Lin Oshitani\",\"primary_group_name\":null,\"flair_name\":null,\"flair_url\":null,\"flair_bg_color\":null,\"flair_color\":null,\"flair_group_id\":null,\"badges_granted\":[],\"version\":1,\"can_edit\":false,\"can_delete\":false,\"can_recover\":false,\"can_see_hidden_post\":false,\"can_wiki\":false,\"read\":true,\"user_title\":null,\"reply_to_user\":{\"id\":2936,\"username\":\"jochem-brouwer\",\"name\":\"Jochem Brouwer\",\"avatar_template\":\"/user_avatar/ethresear.ch/jochem-brouwer/{size}/19918_2.png\"},\"bookmarked\":false,\"actions_summary\":[{\"id\":2,\"count\":1}],\"moderator\":false,\"admin\":false,\"staff\":false,\"user_id\":10476,\"hidden\":false,\"trust_level\":2,\"deleted_at\":null,\"user_deleted\":false,\"edit_reason\":null,\"can_view_edit_history\":true,\"wiki\":false,\"post_url\":\"/t/measuring-per-opcode-proving-time/23955/3\",\"reactions\":[{\"id\":\"heart\",\"type\":\"emoji\",\"count\":1}],\"current_user_reaction\":null,\"reaction_users_count\":1,\"current_user_used_main_reaction\":false,\"can_accept_answer\":false,\"can_unaccept_answer\":false,\"accepted_answer\":false,\"topic_accepted_answer\":null}],\"stream\":[58106,58131,58136]},\"timeline_lookup\":[[1,253],[2,252],[3,251]],\"suggested_topics\":[],\"tags\":[{\"id\":42,\"name\":\"zk-roll-up\",\"slug\":\"zk-roll-up\"},{\"id\":89,\"name\":\"rollup\",\"slug\":\"rollup\"},{\"id\":26,\"name\":\"execution\",\"slug\":\"execution\"},{\"id\":107,\"name\":\"real-time-block-proving\",\"slug\":\"real-time-block-proving\"}],\"tags_descriptions\":{},\"fancy_ti               <p><div class="lightbox-wrapper"><a class="lightbox" href="https://ethresear.ch/uploads/default/original/3X/d/0/d09cce60cfec40f23f6eb84e12a1a2355363ab63.jpeg" data-download-href="https://ethresear.ch/uploads/default/d09cce60cfec40f23f6eb84e12a1a2355363ab63" title="A picture of a prover proving blocks one opcode at a time"><img src="https://ethresear.ch/uploads/default/optimized/3X/d/0/d09cce60cfec40f23f6eb84e12a1a2355363ab63_2_690x460.jpeg" alt="A picture of a prover proving blocks one opcode at a time" data-base62-sha1="tLtgI0eZK0nsJUDMP5QdLHjQPxF" width="690" height="460" srcset="https://ethresear.ch/uploads/default/optimized/3X/d/0/d09cce60cfec40f23f6eb84e12a1a2355363ab63_2_690x460.jpeg, https://ethresear.ch/uploads/default/optimized/3X/d/0/d09cce60cfec40f23f6eb84e12a1a2355363ab63_2_1035x690.jpeg 1.5x, https://ethresear.ch/uploads/default/optimized/3X/d/0/d09cce60cfec40f23f6eb84e12a1a2355363ab63_2_1380x920.jpeg 2x" data-dominant-color="D8D8D8"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">A picture of a prover proving blocks one opcode at a time</span><span class="informations">1536×1024 208 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p>By <a href="https://x.com/linoscope" rel="noopener nofollow ugc">Lin Oshitani</a> (<a href="https://www.nethermind.io/nethermind-research" rel="noopener nofollow ugc">Nethermind Research</a>).  Thanks to <a href="https://www.linkedin.com/in/matteolisotto/" rel="noopener nofollow ugc">Matteo</a>, <a href="https://x.com/smartprogrammer" rel="noopener nofollow ugc">Ahmad</a>, <a href="https://x.com/mpfzajac" rel="noopener nofollow ugc">Michal</a>, <a href="https://x.com/ConorMcMenamin9" rel="noopener nofollow ugc">Conor</a>,  <a href="https://x.com/gusgonzalezs" rel="noopener nofollow ugc">Gustavo</a>, <a href="https://x.com/realdantaik" rel="noopener nofollow ugc">Daniel</a>,  <a href="https://github.com/davidtaikocha" rel="noopener nofollow ugc">David</a>, Yuewang, and <a href="https://x.com/ignaciohagopian" rel="noopener nofollow ugc">Ignacio</a> for the discussions and/or reviews, and thanks to <a href="https://x.com/wisemrmusa" rel="noopener nofollow ugc">Musa</a> for the discussions and for helping run the benchmarks.</p>
<p>This work is funded by <a href="https://taiko.xyz/" rel="noopener nofollow ugc">Taiko</a> as part of the <a href="https://paragraph.com/@taiko-labs/taiko-x-nethermind-building-ethereum-aligned-based-rollup-infrastructure" rel="noopener nofollow ugc">strategic Taiko&lt;&gt;Nethermind partnership</a>.</p>
<h1><a name="p-58106-tldr-1" class="anchor" href="#p-58106-tldr-1" aria-label="Heading link"></a>TL;DR</h1>
<p>What is each opcode’s isolated proving cost? To answer this question, we benchmark the per-gas proving time of individual EVM opcodes and precompiles in a multi-GPU setup, building on the EF’s zkEVM benchmarking tooling and the imapp team’s Gas Cost Estimator marginal method. We also evaluate whether zk cycles are a meaningful proxy for actual proving time using actual proving-time measurements.</p>
<h1><a name="p-58106-introduction-2" class="anchor" href="#p-58106-introduction-2" aria-label="Heading link"></a>Introduction</h1>
<p>As ZK rollups move toward further decentralization, both in terms of <a href="https://medium.com/l2beat/introducing-stages-a-framework-to-evaluate-rollups-maturity-d290bb22befe" rel="noopener nofollow ugc">rollup stages</a> and in the decentralization of sequencers and provers, mitigating <em>prover-killer blocks</em> becomes critical for their security and economic sustainability. These adversarial blocks are constructed to maximize proving time while remaining within the EVM gas limit, <a href="https://arxiv.org/abs/2509.17126" rel="noopener nofollow ugc">creating potential denial-of-service vectors</a> or rendering proving economically unviable. Moreover, as Ethereum L1 itself <a href="https://zkevm.ethereum.foundation/" rel="noopener nofollow ugc">moves toward ZK-based scaling</a>, it will face the same challenge.</p>
<p>Traditional EVM gas metering accounts only for execution costs such as CPU time, storage access, and state growth, but it fails to capture proving costs altogether. As a result, ZK rollups require additional safeguards. A leading approach is to explicitly meter proving costs and enforce block limits based on this metric. Building such mechanisms, however, requires accurate models of how individual operations contribute to overall proving time, precise enough to prevent adversarial blocks without overly harming usability.</p>
<p>To model proving time, we focus on the following core question: <em>how does each EVM opcode or precompile individually contribute to total proving time?</em> Concretely, <em><strong>if we add a given opcode or precompile that consumes an additional X gas, holding all else equal, how much additional proving time does it add?</strong></em> From this, we estimate the marginal proving time per unit of gas for each opcode or precompile.</p>
<p>Prior <a href="https://eth-act.github.io/zkevm-benchmark-runs/benchmarks/" rel="noopener nofollow ugc">zkEVM benchmarking efforts</a> by the Ethereum Foundation provide valuable end-to-end measurements by constructing blocks densely filled with a specific opcode or precompile via a loop. This approach works well for identifying and analyzing operations with very high proving cost, where the cost of the target operation dominates overall proving time. However, because these benchmarks do not explicitly separate per-operation cost from the surrounding overhead (e.g., pushing arguments to the stack, popping return values, and control flow), they are less informative for lower-cost operations, where the surrounding code can significantly affect the measurement. As a result, they are insufficient for building a comprehensive model of proving time across all opcodes and precompiles.</p>
<p>To overcome this limitation, we adopt the <em>marginal</em> measurement approach from the imapp team’s <a href="https://github.com/imapp-pl/gas-cost-estimator/" rel="noopener nofollow ugc">Gas Cost Estimator</a> project, which isolates the contribution of each opcode or precompile from surrounding overhead by creating test cases that vary only the target operation count while holding all other execution context constant. We then fit a linear regression and take the slope to estimate the proving time per unit of gas.</p>
<p>Our benchmark implementation is built on and made possible by the foundation of the Ethereum Foundation’s <a href="https://github.com/eth-act/zkevm-benchmark-workload" rel="noopener nofollow ugc">zkEVM Benchmarking Workload</a> tooling. We created <a href="https://github.com/linoscope/execution-specs/pull/1/changes" rel="noopener nofollow ugc">a suite of custom execution-spec tests</a> following the gas-cost-estimator’s marginal methodology, with extensions to better fit the ZK proving context (e.g., an amplification method to prevent fixed ZK proving setup overhead from dominating the measurements). These fixtures were then executed using a <a href="https://github.com/NethermindEth/ere/pull/1" rel="noopener nofollow ugc">custom fork</a> of EF’s benchmarking tooling with multi-GPU support added for SP1.</p>
<p>Furthermore, we use the benchmarking results to evaluate whether zk cycles are a meaningful proxy for actual proving time using direct proving-time measurements. We find that the relationship between proving time and zk cycles varies widely across opcodes and precompiles, limiting the accuracy of zk cycle-based estimates.</p>
<h1><a name="p-58106-key-results-3" class="anchor" href="#p-58106-key-results-3" aria-label="Heading link"></a>Key Results</h1>
<p><em>We present the results first; readers interested in assumptions and experimental setup can find details in the  <a href="#methodology">Methodology section</a>.</em></p>
<p>In this section, we present the key results of the benchmarks, which were run in the following environment (for more details on the setup, see the methodology section below).:</p>
<ul>
<li>
<p><strong>Prover</strong>: sp1-v5.2.3 (with sp1-cluster) and risc0-v3.0.4 (with <code>RISC0_KECCAK_PO2=15</code> flag to prevent provers from crashing)</p>
</li>
<li>
<p><strong>GPUs</strong>: 4 x NVIDIA GeForce RTX 4090</p>
</li>
<li>
<p><strong>Execution Client:</strong> reth-v1.9.3</p>
</li>
</ul>
<p><strong>Note:</strong> Proving time depends heavily on the run configuration (e.g., prover flags and configurations, hardware/runtime settings, the condition of GPUs at the time of proving, etc.). As such, these results should be interpreted as configuration-specific measurements.</p>
<p><strong>Note:</strong> These benchmarks were run without block header validation. Local testing suggests validation has little effect on most opcodes; LOG-related opcodes see a 4–5× increase, though they remain relatively cheap to prove.</p>
<h2><a name="p-58106-proving-time-per-gas-4" class="anchor" href="#p-58106-proving-time-per-gas-4" aria-label="Heading link"></a>Proving Time per Gas</h2>
<p>Below is the “proving time per gas” for each opcode/precompile in both SP1 and RISC0. This metric represents the additional proving time incurred by using 1 additional gas unit for a specific opcode or precompile. The R^2 value indicates the fit of the linear regression.</p>
<p>More detailed data (e.g., regression plot for each opcode) is hosted here: <a href="https://nethermindeth.github.io/zkevm-benchmark-workload/marginal-gas-benchmark/sp1" rel="noopener nofollow ugc">SP1</a>, <a href="https://nethermindeth.github.io/zkevm-benchmark-workload/marginal-gas-benchmark/risc0" rel="noopener nofollow ugc">RISC0</a></p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://ethresear.ch/uploads/default/original/3X/2/d/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2.jpeg" data-download-href="https://ethresear.ch/uploads/default/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2" title="Proving Time per Gas"><img src="https://ethresear.ch/uploads/default/optimized/3X/2/d/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2_2_258x500.jpeg" alt="Proving Time per Gas" data-base62-sha1="6vbJvNY1PD87gXLOabbv1eztDgK" width="258" height="500" srcset="https://ethresear.ch/uploads/default/optimized/3X/2/d/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2_2_258x500.jpeg, https://ethresear.ch/uploads/default/optimized/3X/2/d/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2_2_387x750.jpeg 1.5x, https://ethresear.ch/uploads/default/optimized/3X/2/d/2d939b8e4d6c1ea4992be2a51f1ecf0ce00ef1f2_2_516x1000.jpeg 2x" data-dominant-color="F9F9F8"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Proving Time per Gas</span><span class="informations">1781×3448 321 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p>Some preliminary observations:</p>
<ul>
<li>
<p>Cryptographic precompiles (e.g., <code>modexp</code>, <code>point_evaluation</code>) in general have high per-gas proving time.</p>
</li>
<li>
<p>Mod/division-related opcodes (<code>mulmod</code>, <code>mod</code>, <code>div</code>, <code>sdiv</code>) have relatively high proving time, as well as <code>selfbalance</code>.</p>
</li>
<li>
<p>Opcodes around log/create (<code>log1</code>, <code>log2</code>, <code>log3</code>, <code>create</code>, <code>create2</code>) have the fastest per-gas proving time for both SP1 and RISC0, likely because their gas costs are dominated by data and storage rather than computation.</p>
</li>
<li>
<p>In general, the relative ranking of opcodes by proving time is similar between RISC0 and SP1, but there are several notable exceptions (e.g., <code>keccak256</code> is ~12x slower in RISC0, <code>sha256</code> is ~10x times faster in RISC0). This is likely due to zkvm precompiles of certain opcodes/precompiles existing in one but not the other (for more comparison between the provers, see the chart in <a href="#appendix-sp1risc0-comparison">Appendix: SP1/RISC0 Comparison</a> ).</p>
</li>
</ul>
<h2><a name="p-58106-proving-time-per-zk-cycle-5" class="anchor" href="#p-58106-proving-time-per-zk-cycle-5" aria-label="Heading link"></a>Proving Time per ZK Cycle</h2>
<p>ZKVMs have the concept of <em>ZK cycles</em>, which represent the number of computational steps the ZKVM executes to prove a program, analogous to CPU cycles in traditional computing. A natural question is: how good a proxy are ZK cycles for actual proving time? If ZK cycles correlate linearly with proving time across all operations, they could serve as a simpler metric for ZK gas metering. However, if the relationship is non-linear or varies significantly across operation types, then proving time must be measured directly for accurate DoS protection.</p>
<p>To answer this question, we fit a linear regression of proving time against zk cycles for each opcode/precompile. Below are the findings.</p>
<p>Within a given operation, the relationship is strongly linear (high R^2): doubling cycles roughly doubles proving time. But the conversion rate from cycles to time is not universal—it depends heavily on the operation.</p>
<p>The bar chart below shows this per-operation “time per zk cycle.” If cycles were a good proxy, all bars would largely align; instead, they spread widely—likely because some operations are implemented in different circuits (e.g., custom zkVM precompiles). For example, in SP1, <code>bn128_add</code> takes ~930 ns per zk cycle while <code>pop</code> takes only ~63 ns, a ~15× gap. This suggests zk cycles alone are insufficient for accurate metering of proving time. Mitigations include:</p>
<ul>
<li>
<p>Meter using measured proving time (as done in this post)</p>
</li>
<li>
<p>Improve cycle accounting to better reflect proving time (e.g., improve zk cycle conversion between different circuits)</p>
</li>
<li>
<p>Use ZK cycles as a proving time proxy, but be conservative, i.e., use numbers from the slowest time per ZK cycle operation.</p>
</li>
</ul>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://ethresear.ch/uploads/default/original/3X/e/c/ec01872733e150805129ab95e610ee2257970a36.jpeg" data-download-href="https://ethresear.ch/uploads/default/ec01872733e150805129ab95e610ee2257970a36" title="Proving TIme per ZK Cycle"><img src="https://ethresear.ch/uploads/default/optimized/3X/e/c/ec01872733e150805129ab95e610ee2257970a36_2_258x500.jpeg" alt="Proving TIme per ZK Cycle" data-base62-sha1="xFNXjgSdpI0SJ0RCbrjH1TT8k7A" width="258" height="500" srcset="https://ethresear.ch/uploads/default/optimized/3X/e/c/ec01872733e150805129ab95e610ee2257970a36_2_258x500.jpeg, https://ethresear.ch/uploads/default/optimized/3X/e/c/ec01872733e150805129ab95e610ee2257970a36_2_387x750.jpeg 1.5x, https://ethresear.ch/uploads/default/optimized/3X/e/c/ec01872733e150805129ab95e610ee2257970a36_2_516x1000.jpeg 2x" data-dominant-color="F3EFE7"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Proving TIme per ZK Cycle</span><span class="informations">1783×3448 419 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<h1><a name="p-58106-methodology-6" class="anchor" href="#p-58106-methodology-6" aria-label="Heading link"></a>Methodology</h1>
<p>We adopt a marginal-cost approach, <a href="https://github.com/imapp-pl/gas-cost-estimator/blob/07c5af9d5b53cb0dd8e9054b41aaef4e3caa4ff8/docs/report_stage_ii.md" rel="noopener nofollow ugc">originally developed</a> by the imapp team for L1 gas repricing as part of the Gas Cost Estimator project, to isolate the proving cost of individual operations.</p>
<p>First, we create 4-7 blocks for each opcode/precompile with varying operation counts (0, N, 2N, 3N, etc.), while maintaining constant overhead by keeping all other factors identical across variants—stack setup, memory initialization, control flow, and cleanup operations.</p>
<p>The table below is an example bytecode structure for the ADD opcode. Notice that each variant has exactly 20 PUSHes and 10 POPs—Only the ADD count varies.</p>
<div class="md-table">
<table>
<thead>
<tr>
<th>op_count</th>
<th>Setup</th>
<th>Main</th>
<th>Cleanup</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>
<td>PUSH×20</td>
<td>—</td>
<td>POP×10</td>
</tr>
<tr>
<td>3</td>
<td>PUSH×20</td>
<td>ADD + (POP + ADD)×2</td>
<td>POP×8</td>
</tr>
<tr>
<td>5</td>
<td>PUSH×20</td>
<td>ADD + (POP + ADD)×4</td>
<td>POP×6</td>
</tr>
<tr>
<td>10</td>
<td>PUSH×20</td>
<td>ADD + (POP + ADD)×9</td>
<td>POP×1</td>
</tr>
</tbody>
</table>
</div><p>Next, we execute each block variant and record the total proving time and gas consumed by the whole block. Then, we fit <code>proving_time = α × gas_used + β</code> across all variants. Here is an example for the ADD opcode in SP1:</p>
<p><div class="lightbox-wrapper"><a class="lightbox" href="https://ethresear.ch/uploads/default/original/3X/e/4/e4bd04b4f9042e3be13f838fb3540f2b89b02709.png" data-download-href="https://ethresear.ch/uploads/default/e4bd04b4f9042e3be13f838fb3540f2b89b02709" title=""><img src="https://ethresear.ch/uploads/default/optimized/3X/e/4/e4bd04b4f9042e3be13f838fb3540f2b89b02709_2_690x427.png" alt="" data-base62-sha1="wDvPF9Lw4EUCtnHvEiZTWt1OADD" width="690" height="427" role="presentation" srcset="https://ethresear.ch/uploads/default/optimized/3X/e/4/e4bd04b4f9042e3be13f838fb3540f2b89b02709_2_690x427.png, https://ethresear.ch/uploads/default/original/3X/e/4/e4bd04b4f9042e3be13f838fb3540f2b89b02709.png 1.5x, https://ethresear.ch/uploads/default/original/3X/e/4/e4bd04b4f9042e3be13f838fb3540f2b89b02709.png 2x" data-dominant-color="FBFAFA"><div class="meta"><svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename"></span><span class="informations">790×489 24.7 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg></div></a></div></p>
<p>The slope <code>α</code> represents the marginal proving time per unit of gas for the opcode or precompile under consideration. Because only the target operation count varies while all other execution context is held constant, <code>α</code> isolates the contribution of that operation. In the example above, we have <code>α = 3.78µs</code>, implying a per-gas proving time of <code>3.78µs</code> for ADD in SP1 with 4 GPUs.</p>
<h2><a name="p-58106-opcodeprecompile-arguments-7" class="anchor" href="#p-58106-opcodeprecompile-arguments-7" aria-label="Heading link"></a>Opcode/Precompile Arguments</h2>
<p>For opcode/precompile arguments, we use fixed inputs chosen to be representative and, where applicable, “worst‑case” on a best‑effort basis. Our choices are guided by known worst-case patterns from <a href="https://eth-act.github.io/zkevm-benchmark-runs/benchmarks/" rel="noopener nofollow ugc">existing benchmarking suites</a>. Using worst-case inputs helps avoid inadvertently measuring optimized fast paths that occur only for special inputs (e.g., all-zero buffers).</p>
<p>Our working assumption is that proving time scales linearly with gas consumption for a given operation, not only across different operation counts, but also across different argument choices within the same operation (i.e., if you double the gas, you double the proving time). This assumes that (1) gas accurately reflects computational complexity, and (2) proving time scales proportionally with that complexity.</p>
<p>In practice, this assumption can fail, e.g., because gas does not accurately reflect computation complexity or because ZKVMs exhibit different behavior for certain arguments. Our measurements should therefore be interpreted as specific to the tested inputs and only as approximations for other inputs. A more fine-grained analysis of argument-dependent proving costs, examining how proving time varies across the whole argument space for each operation, is left for future work.</p>
<p>Finally, for operations like LOG and CREATE, where gas is primarily driven by data size and memory expansion rather than computation, we use standard arguments (e.g., 32-byte payloads) and not worst-case arguments in terms of gas. Using large payloads would inflate gas costs without meaningfully increasing proving work, underestimating the computational proving overhead per gas unit.</p>
<h2><a name="p-58106-integration-with-ef-benchmarking-tooling-8" class="anchor" href="#p-58106-integration-with-ef-benchmarking-tooling-8" aria-label="Heading link"></a>Integration with EF Benchmarking Tooling</h2>
<p>Our benchmarking pipeline builds on the Ethereum Foundation’s <a href="https://github.com/eth-act/zkevm-benchmark-workload" rel="noopener nofollow ugc">zkEVM Benchmarking Workload</a>, and we introduce two key extensions:</p>
<ul>
<li>
<p><strong>Custom EEST marginal tests/fixtures</strong>: We add <a href="https://github.com/linoscope/execution-specs/pull/1/changes" rel="noopener nofollow ugc">custom execution-spec-tests</a> (EEST) that follow the marginal methodology.</p>
</li>
<li>
<p><strong>Multi-GPU SP1 support</strong>: We <a href="https://github.com/NethermindEth/ere/pull/1" rel="noopener nofollow ugc">extend</a> the EF’s ZKEVM benchmark tooling to support SP1 cluster execution, allowing the same workload to be proven using 4 GPUs.</p>
</li>
</ul>
<p>With these additions, we generate EEST fixtures, convert them to zkEVM witness inputs using the EF tooling, run proving through the EF host runner (SP1 on 4 GPUs or RISC0), and then post-process the resulting metrics (proving time, gas, zk cycles) to fit regressions and extract marginal proving time per gas (or per zk cycles).</p>
<h1><a name="p-58106-applications-next-steps-9" class="anchor" href="#p-58106-applications-next-steps-9" aria-label="Heading link"></a>Applications &amp; Next Steps</h1>
<p>Here are some potential practical applications of these measurements:</p>
<ul>
<li>
<p><strong>ZK-aware block metering for ZK rollups</strong>: The per-gas proving-time measurements can be used to directly meter and cap the proving cost of blocks. Concretely, one can define a “ZK Gas” metric by weighting the gas consumed by each opcode/precompile with a multiplier derived from its measured proving-time-per-gas. By capping the total ZK Gas per block, the protocol can cap worst-case proving time and mitigate prover-killer blocks.</p>
</li>
<li>
<p><strong>Guidance for zkVM implementers</strong>: The per-operation breakdown highlights which opcodes/precompiles need improvements, helping zkVM teams prioritize optimizations (e.g., specialized circuits). It also provides a concrete signal for improving ZK cycle accounting so that the ZK cycle number tracks proving time more uniformly across different circuit paths.</p>
</li>
<li>
<p><strong>Guidance for client implementers</strong>: Client teams can use these measurements to identify ZK-unfriendly hotspots and optimize specific opcode/precompile implementations or execution patterns to reduce proving overhead.</p>
</li>
</ul>
<p>For the next steps of the project:</p>
<ul>
<li>
<p><strong>Argument-dependent benchmarking</strong>: Extend the methodology to sweep across all inputs.</p>
</li>
<li>
<p><strong>Continuous performance monitoring</strong>: Automate the pipeline end-to-end (fixture generation → witness generation → proving → regression → reporting) so per-opcode/precompile zkVM/client performance can be tracked over time.</p>
</li>
<li>

          <div id='post_2' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">

              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2026-01-28T21:56:07Z' class='post-time'>

            <div class='post' itemprop="text">
              <p>Hey, very nice report, we are working on similar benchmarks reports but now for the current “classic” (?) EL architecture in the context of gas repricing.</p>
<p>Some questions:</p>
<ol>
<li>I do not see <code>BLOCKHASH</code> opcode. I know this is a rather “special” opcode as pre-EIP-2935 you need to do a database inspection (now you can do a storage read from the EIP-2935 contract). Is there a specific reason why this opcode is not in these zk benchs?</li>
<li>AFAIK the difference between SHA256 and KECCAK256 is only a few constants. The difference (as mentioned in your report) is huge here. This should however be somewhat easy (?) to solve? I am mainly baffled by this huge difference (but, I’m a super novice to the zk-world so I’m treating those as black box)</li>
<li>You mention argument-dependent benchmarking. For the EL side we have, especially for the ModExp precompile, really went in the rabbit hole to construct the worst case inputs to get the worst case execution time, per client (as this depends on the implementation of that precompile and certain assumptions/optimizations). I assume that the “worst case” situations for zkVMs might be different than those in “classic” VMs (live VMs as executed now). How would one find these worst case situations and is there any way we can help in this effort?</li>
</ol>
<p>Thanks <img src="https://ethresear.ch/images/emoji/facebook_messenger/smiley.png?v=14" title=":smiley:" class="emoji" alt=":smiley:" loading="lazy" width="20" height="20"> <img src="https://ethresear.ch/images/emoji/facebook_messenger/+1.png?v=14" title=":+1:" class="emoji" alt=":+1:" loading="lazy" width="20" height="20"></p>
            </div>

          <div id='post_3' itemprop="comment" itemscope="itemscope" itemtype="http://schema.org/Comment" class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope="itemscope" itemtype="http://schema.org/Person">
                <a rel='nofollow' href='https://ethresear.ch/u/linoscope'><span itemprop="name">linoscope</span></a>
                  <meta itemprop='url' content='https://ethresear.ch/u/linoscope'>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop="datePublished" datetime='2026-01-29T05:14:08Z' class='post-time'>
                    January 29, 2026,  5:14am
                  </time>
                  <meta itemprop='dateModified' content='2026-01-29T05:14:08Z'>
              <span itemprop="position">3</span>
              </span>
            </div>
            <div class='post' itemprop="text">
              <p>Thanks for the comment &amp; questions!</p>
<blockquote>
<ol>
<li>I do not see <code>BLOCKHASH</code> opcode. I know this is a rather “special” opcode as pre-EIP-2935 you need to do a database inspection (now you can do a storage read from the EIP-2935 contract). Is there a specific reason why this opcode is not in these zk benchs?</li>
</ol>
</blockquote>
<p>Good find! Actually, this was accidental, I ran this run with blockhash commented out <img src="https://ethresear.ch/images/emoji/facebook_messenger/sweat_smile.png?v=14" title=":sweat_smile:" class="emoji" alt=":sweat_smile:" loading="lazy" width="20" height="20"> . But from previous runs, blockchash didn’t really stand out, its per-gas proving time was around the same as the PUSH opcodes.</p>
<blockquote>
<ol>
<li>AFAIK the difference between SHA256 and KECCAK256 is only a few constants. The difference (as mentioned in your report) is huge here. This should however be somewhat easy (?) to solve? I am mainly baffled by this huge difference (but, I’m a super novice to the zk-world so I’m treating those as black box)</li>
</ol>
</blockquote>
<p>Yeah, was surprised to see this too (I am also no expert in zkvms or ZK/cryptography in general, so it’s a black box too <img src="https://ethresear.ch/images/emoji/facebook_messenger/slightly_smiling_face.png?v=14" title=":slightly_smiling_face:" class="emoji" alt=":slightly_smiling_face:" loading="lazy" width="20" height="20"> ). From the data, I can see that:</p>
<ul>
<li>The huge difference is only in RISC0, in SP1 it’s more consistent.</li>
<li>The RISC0 per-gas proving time for <code>SHA256</code> is 10 times faster than SP1’s.</li>
</ul>
<p>So maybe RISC0 has some strong optimization specifically for SHA256?</p>
<blockquote>
<p>I assume that the “worst case” situations for zkVMs might be different than those in “classic” VMs (live VMs as executed now)</p>
</blockquote>
<p>One thing I wonder is whether the “worst case” for zkVMs is fundamentally different from that of classic VMs. If classic gas accurately reflects execution time, and proving time scales proportionally with execution, then in principle the same benchmark models could carry over to the ZK setting, or ZK metering could even be done through a simple multiplier on execution gas. That said, zkVM implementations can have quirks that make proving time respond differently to argument changes than execution time. So definitely still worth testing ZK separately.</p>
<blockquote>
<p>How would one find these worst case situations and is there any way we can help in this effort?</p>
</blockquote>
<p>Tbh haven’t put too much thought on it so far - You probably need to model proving time in terms of arguments and fit is using actual benchmarks. I assume we will need similar effort for “classic” VM execution, and that it will be applicable to ZK setting too (actually, Ignacio made a good point that we should just have one benchmark suite both for ZK and execution, which makes sense). So looking forward to what you all do here, and also happy to help out in any way too!</p>
            </div>
