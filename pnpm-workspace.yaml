packages:
  - packages/*
allowBuilds:
  "@sveltejs/kit": true
  bufferutil: true
  es5-ext: true
  esbuild: true
  keccak: true
  lefthook: true
  "optimism@git+https://github.com/ethereum-optimism/optimism.git": true
  protobufjs: true
  secp256k1: true
  svelte-preprocess: true
  utf-8-validate: true
engineStrict: true
resolutionMode: highest
